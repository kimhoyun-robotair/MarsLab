[project]
name = "marslab"
version = "0.1.0"
description = "Standardized Mars simulation platform for planetary robotics research"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
    "matplotlib>=3.5",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["marslab*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Reviewer 2 #18 (2026-04-24): E/F/W/I baseline + B (bugbear) + SIM (simplify).
# UP (pyupgrade) is deferred: it produces ~290 violations across the tree
# (mostly ``List`` -> ``list`` and ``Optional`` -> ``X | None``) and should
# land as a dedicated Reviewer 2 batch rather than mixed with packaging.
select = ["E", "F", "W", "I", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["marslab"]

[tool.mypy]
# Reviewer 2 #18 (2026-04-24): initial pragmatic profile scoped to
# pure-Python offline modules only.  Full-repo strict mode is deferred to
# v2.0 because Isaac Sim USD handles rely on runtime typing and would
# require custom stub packages to pass strict mypy.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["marslab/config", "marslab/environment"]

[[tool.mypy.overrides]]
module = ["launch"]
follow_imports = "skip"
