[project]
name = "marslab-scene"
version = "0.1.0"
description = "Offline scene construction toolchain for MarsLab"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "affine>=2.4",
  "numpy>=1.26",
  "pydantic>=2",
  "PyYAML>=6",
  "rasterio>=1.3",
  "scipy>=1.11",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
standalone-usd = ["usd-core>=25"]
test = ["basedpyright>=1.31", "build>=1", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["marslab_scene*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "unit: pure Python or numerical behavior",
  "contract: schema, path, manifest, and artifact contracts",
  "standalone_usd: standalone USD validation outside Isaac",
  "legacy_parity: source-to-target migration parity",
  "isaac_runtime: actual Isaac runtime integration",
  "marslab_runtime: actual MarsLab runtime regression",
  "paper_reproduction: actual paper input reproduction",
]

[tool.basedpyright]
typeCheckingMode = "all"
stubPath = "typings"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["marslab_scene"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportMissingModuleSource = "none"
reportPrivateUsage = "error"
reportUnnecessaryComparison = "none"
reportAny = "none"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["marslab_scene", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "ISC001",
  "D101",
  "D102",
  "D105",
  "D107",
  "D203",
  "D213",
  "CPY001",
  "EM101",
  "FBT001",
  "FBT002",
  "FIX002",
  "N818",
  "TC001",
  "TC002",
  "TC003",
  "TD002",
  "TD003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S108", "ARG", "PLR2004", "SLF001", "D"]
"typings/**/*.pyi" = ["N802", "N815"]

[tool.ruff.lint.pydocstyle]
convention = "google"
