# NASA JPL Perseverance (M2020) rover -- common base configuration.
#
# This file is consumed by scenarios via
# ``configs/scenarios/<name>.yaml``  ->  rover.base_config .
# The scenario loader deep-merges the scenario's ``rover:`` block onto
# these defaults (scenario wins on leaf conflicts).
#
# Do NOT put per-scenario tweaks here -- put them in the scenario YAML
# instead.

# Just For Reference
usd_path: "assets/robots/rover/m2020.usd"
urdf_source_path: "assets/m2020-urdf-models/rover/m2020.urdf"
prim_path: "/World/Rover"

# URDF link frame is REP-103 aligned (+X forward, +Y left, +Z up) since the
# 2026-05-04 FRD->REP-103 rewrite (rc1b_urdf_rep103). No X-roll spawn
# compensation is required; identity rpy spawns the rover upright.
spawn_position: [0.0, 0.0, 0.0]
spawn_orientation_rpy: [0.0, 0.0, 0.0]

# Spawn modes (consumed by ``marslab.main._resolve_spawn``):
#   dem_center        — spawn at DEM bbox centre. ``xy`` ignored.
#   dem_relative      — spawn at ``(dem_center_x + xy[0], dem_center_y + xy[1])``.
#   absolute          — spawn at ``(xy[0], xy[1])`` in the world frame.
# In every mode, ground Z is sampled from the DEM at the resolved XY and the
# rover Z is set to ``surface_z + z_offset``. ``z_offset`` here overrides the
# CLI ``--z-offset`` flag if present.
spawn:
  mode: "dem_center"
  xy: [0.0, 0.0]
  z_offset: 0.1
  orientation_rpy: [0.0, 0.0, 0.0]

# Chassis CoM offset (m).  Empirically determined +0.2 m forward shift.
# Even after the JPL URDF arm/turret/drill (~74 kg) was stripped, the
# chassis bbox-derived inertia tensor (computed about the geometric
# centre) does not match the real M2020 mass distribution -- the
# electronics box / MMRTG / cabling sit forward of the wheelbase
# midpoint.  Empirical evidence (delete_later/imu_diagnostic/imu_stat.py
# 2026-05-04 run): com_offset = [0, 0, 0] yields stationary lin_x mean
# = +1.27 m/s^2 (~20 deg forward pitch); com_offset = [0.2, 0, 0]
# brings it down to +0.43 m/s^2 (~6.6 deg).  Keep the +0.2 value;
# further refinement is a v1.5 task (IMU diagnostic + chassis
# inertia re-tune).
com_offset: [0.2, 0.0, 0.0]
angular_damping: 12.0
linear_damping: 0.5

# --- M2020 ballpark physics override ---
# Values below are M2020 Perseverance order-of-magnitude correct (NOT exact).
# Speed/control limits stay user-tunable (see ``control:`` block); these
# blocks pin chassis mass / wheel mass / friction / inertia so the URDF
# auto-computed placeholders never reach PhysX.  Sources cited inline.

chassis:
  # Total dry mass of M2020 Perseverance per NASA fact sheet (1025 kg).
  # mars.nasa.gov/mars2020/spacecraft/rover/  (M2020 actual).
  mass: 1025.0
  # Bounding-box inertia tensor from chassis envelope 3.0 m x 2.7 m x 2.2 m
  # at M = 1025 kg.  Solid uniform rectangular cuboid:
  #   ixx = M/12 * (W^2 + H^2)
  #   iyy = M/12 * (L^2 + H^2)
  #   izz = M/12 * (L^2 + W^2)
  # Computed offline (see test_rover_physics_inject.py::test_chassis_inertia_matches_bbox).
  # Replaces URDF auto-computed placeholder so PhysX sees a deterministic
  # tensor.  M2020 ballpark — NOT a calibrated CAD-derived inertia.
  inertia_xx: 1036.1   # kg*m^2  (W=2.7, H=2.2)
  inertia_yy: 1182.2   # kg*m^2  (L=3.0, H=2.2)
  inertia_zz: 1391.4   # kg*m^2  (L=3.0, W=2.7)
  bbox_lwh: [3.0, 2.7, 2.2] # documentation only — used by the unit test
                                        #   to recompute inertia from first principles.

wheels:
  # The current ``control.wheel_radius``
  # of 0.2667 m corresponds to a 0.5334 m diameter (URDF-derived); we keep
  # that value for kinematic IK consistency and document the 1.6 % gap below.
  radius: 0.2667           # m  — matches ``control.wheel_radius`` exactly.
  diameter_reference: 0.525  # m  — M2020 actual; documentation only.
  # Per-wheel mass estimate (M2020 ballpark).  Public M2020 papers do not
  # publish a per-wheel mass; 9.0 kg is a literature-aligned estimate for an
  # aluminum-machined, spoked rover wheel of this diameter.  6 wheels x 9 kg
  # = 54 kg total — leaves the 1025 kg chassis dominating articulation
  # inertia, which matches the M2020 mass distribution.
  mass: 9.0                # kg per wheel — M2020 estimate.
  # Cylinder inertia about the spin axis (X) and the two transverse axes:
  #   I_spin       = m * r^2 / 2
  #   I_transverse = m * (3 r^2 + h^2) / 12   with h = wheel width
  # Wheel width assumed h = 0.40 m (M2020 ballpark).  Inertia values are
  # offline-computed in the unit test for evidence.
  width: 0.40              # m  — wheel width (M2020 ballpark).
  inertia_spin: 0.310      # kg*m^2  (about spin axis)
  inertia_transverse: 0.275  # kg*m^2  (radial axes)
  # PhysX material friction.  Mars regolith literature (Sullivan et al. 2017,
  # JGR; Heverly et al. 2013) places effective wheel-soil friction in the
  # 0.4-0.7 range; we adopt the midpoint as a starting point.  Static >
  # dynamic so the rover does not creep on slope hold.
  friction_static: 0.6     # mu_s — Mars regolith literature.
  friction_dynamic: 0.5    # mu_d — Mars regolith literature.
  restitution: 0.0         # No bounce on regolith (literature consensus).

suspension:
  # Rocker-bogie joint damping (passive viscous resistance).  The pre-existing
  # ``control.suspension_damping = 50`` covered every rocker/bogie joint with
  # one number; we now distinguish rocker vs bogie so future tuning can
  # target the differential beam without touching the bogie pivot.
  rocker_damping: 75.0     # N*m*s/rad  — primary rocker arms.
  bogie_damping: 50.0      # N*m*s/rad  — bogie sub-arms (matches legacy).

ros2:
  namespace: "rover"
  topics:
    cmd_vel: "cmd_vel"
    robot_description: "robot_description"
    imu: "imu"           # OmniGraph PubIMU — raw PhysX readings, no noise
    imu_noisy: "imu_noisy"  # Python imu_noise_publisher — seeded Gaussian noise injected; only active when imu.sigma_* > 0
    odom: "odom"                 # wheel-encoder dead-reckoning estimate (SLAM input)
    gt_trajectory: "GT_Trajectory"  # PhysX articulation pose verbatim (ATE ground truth)
    rgb: "rgb/image_raw"
    depth: "depth/image_raw"
    points: "depth/points"       # RGB-D PointCloud2 (RealSense-style)
    camera_info: "rgb/camera_info"  # CameraInfo (intrinsics K/P/R/D)
    lidar: "lidar/points"
    scan: "scan"                 # 2D LaserScan for SLAM
    joint_states: "joint_states" # sensor_msgs/JointState for robot_state_publisher
  rates:
    # IMU is locked to 30 Hz to match the effective PhysX physics tick
    # observed under GPU-bound rendering (delete_later/imu_diagnostic/
    # imu_stat.py reported ~31 Hz publish rate even when this value was
    # set to 60).  Matching the rates avoids 60-vs-30 sampling aliasing
    # in the linear_acceleration topic.
    imu: 30
    odom: 50
    rgb: 30
    depth: 30
    points: 30               # depth-derived PointCloud2 matches the depth rate
    camera_info: 30      # CameraInfo published in lock-step with rgb/depth
    lidar: 30          # For ROS2 Point Cloud Topic Publishing Rate, Not same as the RTX LiDAR rotation rate (see ``lidar_3d.rotation_rate_hz`` below).
    scan: 30         # For ROS2 LaserScan Topic Publishing Rate, Not same as the RTX LiDAR rotation rate (see ``lidar_2d.rotation_rate_hz`` below).
    joint_states: 50             # OG ROS2PublishJointState tick rate (matches odom)
  # Frame names threaded through ``create_odometry_publisher`` so the
  # SLAM stack YAML shares one source of truth.
  # Since the URDF is REP-103 aligned (post rc1b_urdf_rep103), the URDF
  # root link ``Body_Chassis`` already publishes in REP-103, so
  # ``base_link`` and ``Body_Chassis`` resolve to the same frame
  # (no X-roll wrapper needed).  SLAM launch params should set
  # ``base_frame: base_link`` to match.
  odom_publisher:
    frame_id: "odom"
    child_frame_id: "base_link"
    queue_size: 10
  # Parent frame for the static sensor TFs broadcast by
  # ``marslab.ros2_bridge.tf_broadcaster.publish_static_sensor_tfs``.
  # Default ``Body_Chassis`` matches the URDF root link name so the
  # rclpy-published sensor offsets attach to the
  # robot_state_publisher-published articulation chain.  Override
  # to ``base_link`` if running the legacy ``rename_root_to_base_link=True``
  # rewrite path (or any third-party stack that hardcodes ``base_link``).
  sensor_parent_frame_id: "Body_Chassis"
  # Enable rclpy-side TF broadcast of ``odom -> base_link``
  # using the PhysX articulation root pose as ground-truth odometry.
  # Replaces the dependency on an external visual SLAM stack
  # (RTAB-Map ``rgbd_odometry``, ORB-SLAM3, etc.) for the odom
  # transform.  The init_quat_world is forced to identity in the
  # runtime entry point (marslab/main.py) so the odom frame
  # equals world REP-103.  Since the URDF is REP-103 aligned (post
  # rc1b_urdf_rep103), spawn_orientation_rpy is identity and no
  # X-roll compensation is applied.  Set ``false`` to delegate
  # ``odom -> base_link`` to a downstream visual SLAM stack;
  # never run two publishers on the same transform.
  publish_odom_tf: true

sensors:
  # Master RNG seed for all Python-side sensor noise models.
  # Same seed → identical noise sequence on rerun (wheel odom, IMU, depth camera).
  # Omit or set to null for nondeterministic behaviour (original default).
  # Per-sensor RNGs are derived independently via np.random.SeedSequence so
  # changing one sensor's parameters does not shift another's sequence.
  seed: 42

  # Sensor frames are authored in the URDF body frame, which is REP-103
  # aligned (+X forward, +Y left, +Z up) since the 2026-05-04 rc1b URDF
  # rewrite.  A sensor 2.1 m above the chassis is at ``z = +2.1``.
  # ``tf_broadcaster.py`` broadcasts these values identity; no X-roll
  # compensation is applied anywhere in the chain.
  camera:
    parent_link: "Body_Chassis"
    local_translation: [1.2, 0.0, 2.1]
    # URDF body frame is REP-103 (Z-up) post rc1b rewrite, so the camera
    # parent Xform inherits an upright frame.  The image is broadcast
    # with identity rpy; no X-roll compensation is needed.  An earlier
    # iteration kept [180, 0, 0] under the assumption that the camera
    # prim required an Isaac-Sim-convention image-plane flip, but
    # empirical verification (2026-05-04) showed the resulting RGB image
    # was inverted -- the [180, 0, 0] was a Z-down URDF compensation,
    # not an Isaac-Sim convention requirement.
    local_orientation_rpy_deg: [6.6,  0.0, 90.0]
    resolution: [1280, 960]
    focal_length: 18.0
    clipping_range: [0.1, 100.0]
    # Optional stereo-disparity depth simulation
    # (OmniSensorDepthSensorSingleViewAPI schema).  ``enabled: false`` keeps
    # the v0.7 / v1.0 behaviour where depth comes from the renderer's
    # noiseless ``DistanceToImagePlane`` AOV.  Flip ``enabled`` to ``true``
    # for RealSense-style simulated depth with disparity noise, occlusion
    # holes, and a confidence map.  Defaults are RealSense D455 ballpark;
    # adjust ``baseline_mm`` per scenario (M2020 Navcam baseline ~ 420 mm).
    depth_sensor:
      enabled: false
      baseline_mm: 55.0
      min_distance_m: 0.3
      max_distance_m: 100.0
      noise_mean: 0.0
      noise_sigma: 0.005
      confidence_threshold: 0.95
      max_disparity_pixel: 110.0

  # 3D rotary RTX LiDAR.  Every numeric parameter that used to hide inside
  # Isaac Sim's ``Example_Rotary.json`` profile is declared here so the YAML
  # is the single source of truth.  Values mirror the bundled JSON: 16-beam
  # Velodyne-style scanner, 30 deg vertical FOV, 360 deg horizontal at
  # 0.4 deg horizontal step, 10 Hz rotation, 0.5-100 m range.
  lidar_3d:
    parent_link: "Body_Chassis"
    local_translation: [1.45, 0.0, 2.1]
    # URDF body frame is REP-103 (Z-up) post rc1b rewrite, so the
    # lidar_link ROS frame inherits the canonical axis directly with
    # identity rpy.  No X-roll compensation needed.
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]
    range_min: 5.0
    range_max: 100.0
    horizontal_fov_deg: 220.0
    vertical_fov_deg: 45.0
    horizontal_resolution_deg: 0.4
    vertical_resolution_deg: 1.875
    rotation_rate_hz: 30.0
    profile_name: "OS1" # Isaac Sim Bundled RTX LiDAR asset key (Ouster OS1 USD carries variant set)
    profile_json_path: null
    # Swap the LiDAR USD model by changing this key (e.g. ``Velodyne_VLP16``).
    # ``null`` falls back to ``profile_name``.
    usd_profile: null
    # Variant inside the OS1.usd asset (128-channel @ 10 Hz, 1024 horizontal samples).
    variant: "OS1_REV6_128ch10hz1024res"

  # 2D LaserScan sensor for SLAM.  Clones the RTX Lidar
  # pipeline used by ``lidar_3d``; only the bundled profile and mount
  # height differ (0.25 m below the 3D lidar).  Numerics mirror the
  # Isaac Sim bundled ``Example_Rotary_2D`` JSON (single beam at -2 deg
  # elevation, 360 deg horizontal, 0.25 deg step, 30 Hz rotation).
  lidar_2d:
    parent_link: "Body_Chassis"
    local_translation: [1.4, 0.0, 0.7]
    # URDF body frame is REP-103 (Z-up) post rc1b rewrite, so /rover/scan
    # publishes in the canonical ROS axis with identity rpy.
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]
    range_min: 0.5
    range_max: 20.0
    horizontal_fov_deg: 200.0
    horizontal_resolution_deg: 0.25
    rotation_rate_hz: 30.0
    profile_name: "Example_Rotary_2D" # Isaac Sim Bundled RTX LiDAR profile (single-beam 2D)
    # Swap the LiDAR USD model by changing this key (e.g. ``Velodyne_VLP16``).
    # ``null`` falls back to ``profile_name``.
    profile_json_path: null
    usd_profile: null

  imu:
    parent_link: "Body_Chassis"
    local_translation: [0.0, 0.0, 0.0]
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]
    # Python-side Gaussian noise (seeded from sensors.seed).
    # Zero disables noise injection (preserves raw PhysX readings via OmniGraph).
    sigma_lin_acc: 0.05   # m/s^2 per axis — MEMS IMU ballpark
    sigma_ang_vel: 0.005  # rad/s per axis — MEMS gyro ballpark

control:
  # Geometry derived from URDF kinematic chain (m2020.urdf).
  wheel_radius: 0.2667
  wheelbase: 2.26
  track_steer: 2.125
  track_middle: 2.369
  max_linear_velocity: 4.0
  max_angular_velocity: 0.7

  drive_joint_names:
    - "LF_DRIVE"
    - "LM_DRIVE"
    - "LR_DRIVE"
    - "RF_DRIVE"
    - "RM_DRIVE"
    - "RR_DRIVE"
  steer_joint_names:
    - "LF_STEER"
    - "LR_STEER"
    - "RF_STEER"
    - "RR_STEER"
  suspension_joint_names:
    - "CENTER_DIFFERENTIAL"
    - "LEFT_DIFFERENTIAL"
    - "RIGHT_DIFFERENTIAL"
    - "LEFT_BOGIE"
    - "RIGHT_BOGIE"

  suspension_damping: 50.0
  drive_damping: 1000.0
  drive_max_force: 1000000.0
  steer_stiffness: 50000.0
  steer_damping: 5000.0
  steer_max_force: 100000.0
  drive_type: "acceleration"

  negate_steer: true
  max_wheel_accel_rate: 0.5
  max_steer_angle: 0.7
  steer_ramp_rate: 2.0
  decel_multiplier: 3.0
  debug_logging: false

# Wheel-encoder dead-reckoning odometry publisher (skid-steer FK).
# Subscribes to wheel joint angular velocities, injects slip + Gaussian
# noise, integrates pose, and publishes nav_msgs/Odometry on
# ``/<ns>/odom``.  This is the SLAM input -- the PhysX GT pose lives on
# ``/<ns>/GT_Trajectory`` for ATE comparison.  See GT_Trajectory.md.
wheel_odometry:
  enabled: true
  left_wheel_joints:  ["LF_DRIVE", "LM_DRIVE", "LR_DRIVE"]
  right_wheel_joints: ["RF_DRIVE", "RM_DRIVE", "RR_DRIVE"]
  track_width: 2.369        # m — matches control.track_middle (rear-axle).
  slip_left:  0.02          # fractional rotational slip (0 = no slip).
  slip_right: 0.02
  sigma_omega: 0.05         # rad/s -- Gaussian noise on each wheel bank.
  # seed is intentionally omitted here; it is injected at runtime from
  # sensors.seed (via main.py child[0] SeedSequence). When sensors.seed
  # is None the wheel odom RNG uses a nondeterministic seed.
