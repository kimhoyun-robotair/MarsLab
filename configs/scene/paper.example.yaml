schema_version: 1

scene:
  id: jezero
  compatibility_profile: marslab_utils_6f30d67

terrain:
  source:
    type: hirise
    dem: ../../data/jezero.tif
  crop: {}
  mesh: {}
  texture: {}
  appearance: {}
  modifiers: []

layers:
  rocks:
    enabled: true
    asset: ../../assets/rocks/manifest.yaml
    placements: ../../data/placements/jezero_rocks.csv
    seed: 42
    top_k: 3
    scale_clamp: [0.5, 2.0]
  habitat:
    enabled: true
    asset: ../../assets/habitats/manifest.yaml
    placement:
      mode: flattest
      z_align: body_floor_to_surface
      z_offset_m: -0.5

output:
  directory: ../../assets/scene/jezero
  stage: scene.usda
  runtime_package: scene.usdz
  manifest: manifest.yaml
