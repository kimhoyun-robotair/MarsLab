# Cerberus Fossae Canyon Scenario (Challenge)
# HiRISE DEM crop: mid-south canyon rim + floor
# dz=460m, mean_slope=25.3 deg, traversable(<15 deg)=43%, impassable(>30 deg)=28%
# Scenario flow: plain approach -> canyon rim -> slope descent -> canyon floor
# Purpose: traversability limits, SLAM degradation, path planning under constraints

mars_env:
  gravity: 3.72
  atmo_pressure: 610
  atmo_density: 0.020
  dust_optical_depth: 0.3
  solar_constant_mean: 589
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60
  sol_duration_seconds: 88642
  dust_opacity_range: [0.5, 2.0]
  sun_azimuth_deg: 180
  sun_elevation_deg: 45
  seed: 42
  dynamic_atmosphere:
    enabled: true
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    tau_profile: "constant"
    tau_constant:
      base_tau: 0.3
    update_interval_frames: 10

terrain:
  source: "hirise"
  scenario_name: "cerberus_canyon"
  converted_dem_dir: "assets/terrain/dem/cerberus_fossae_converted"
  dem_crop:
    row: 8000
    col: 2800
    height: 500
    width: 500
  rock_sfd_k: 0.008
  rock_diameter_range: [0.15, 2.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

rendering:
  mode: "ray_tracing"
  sky_dome_hdri_dir: "assets/sky/hdri/"
  resolution: [1920, 1080]
  spp: 32
  total_spp: 256
  max_bounces: 6
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # HiRISE Cerberus Fossae challenge crop: spawn on the plain
  # approach (north edge of crop) so the rover drives toward the
  # rim before descending into the canyon.  z_offset=0.8 because
  # the HiRISE tile has bouldery surface texture.
  spawn:
    mode: "dem_relative"
    xy: [0.0, 200.0]
    z_offset: 0.8
    orientation_rpy: [3.14159, 0.0, -1.570796]  # yaw=-90° ⇒ face -Y toward rim
