# Procedural Canyon Scenario (Corridor)
# Synthetic canyon: steep walls on both sides, traversable floor in the center
# Floor width ~30m, total canyon width ~80m, depth ~40m
# Small craters on floor for obstacle avoidance
# Purpose: navigation, exploration, SLAM, traversability in confined corridor
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "procedural"
  scenario_name: "procedural_canyon"
  procedural_preset: "canyon"
  terrain_size: [300, 300]
  terrain_resolution: 1.0
  seed: 42
  canyon_depth: 40.0
  canyon_floor_width: 30.0
  canyon_total_width: 80.0
  canyon_curvature: 0.3
  canyon_craters: 2
  canyon_crater_radius_range: [5, 15]
  canyon_crater_depth_range: [2, 6]
  rock_sfd_k: 0.008
  rock_diameter_range: [0.10, 1.5]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Canyon centreline runs along the DEM row axis (N-S) with the
  # floor at X≈0.  Spawn 10 m inside the southern rim on the floor,
  # facing +Y so the rover can traverse the entire corridor.
  # Domain 300 m × 300 m ⇒ south edge at Y=-150, so Y=-140 gives
  # a safe margin.
  spawn:
    mode: "dem_relative"
    xy: [0.0, -140.0]
    z_offset: 0.4
    orientation_rpy: [3.14159, 0.0, 1.570796]  # yaw=+90° ⇒ face +Y
