# Scenario base block: shared mars_env + rendering defaults.
# ---------------------------------------------------------------
# Reviewer 2 #17 (2026-04-24): all nine scenarios previously duplicated
# ~35 lines of identical ``mars_env`` + ``rendering`` YAML (gravity,
# atmo_pressure, dust defaults, sun/dome/fog tunables, etc.). This file
# holds the shared defaults so each scenario YAML only needs its real
# overrides (``sun_elevation_deg`` for ``mars_base``, ``sun_azimuth_deg``
# for ``spacecraft_landing``, ``dynamic_atmosphere.enabled: true`` for
# every runnable scenario).
#
# Loaded via ``base_config: _base.yaml`` at the scenario root. The
# scenario YAML deep-merges on top (scenario wins, lists replace).
#
# NB: this file intentionally omits ``terrain`` — every scenario fully
# specifies its own terrain block (hirise crop or procedural preset +
# knobs), so sharing ``terrain`` would just leak the wrong preset into
# hirise scenarios. ``configs/mars_env.yaml`` keeps the master defaults
# for the runtime's ``load_and_validate`` on the flat-config path.
# ---------------------------------------------------------------

mars_env:
  gravity: 3.72
  atmo_pressure: 610
  atmo_density: 0.020
  dust_optical_depth: 0.3
  solar_constant_mean: 589
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60
  sol_duration_seconds: 88642
  dust_opacity_range: [0.5, 2.0]
  sun_azimuth_deg: 180
  sun_elevation_deg: 45
  seed: 42
  dynamic_atmosphere:
    # Scenario YAMLs flip ``enabled`` to ``true`` when they want the
    # sun sweep running; the shared base keeps the static-pose default
    # so an out-of-the-box ``_base.yaml`` load is boring and safe.
    enabled: false
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    tau_profile: "constant"
    tau_constant:
      base_tau: 0.3
    update_interval_frames: 10

scene:
  # Sprint Day-2 Task H (2026-04-26): empty default so every scenario
  # inherits a parsable ``scene.structure_assets`` list. Scenarios that
  # actually want OBJ/STL drop-ins override this list; unrelated
  # scenarios pick up the empty default and parse without change.
  structure_assets: []

rendering:
  mode: "ray_tracing"
  sky_dome_hdri_dir: "assets/sky/hdri/"
  resolution: [1920, 1080]
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]
  # Flat path-tracing keys kept here — RenderingConfig's
  # _migrate_flat_to_nested pre-validator folds them into the nested
  # ``path_tracing`` block for pydantic. Using the flat form keeps the
  # YAML diff against the pre-#17 scenarios trivial.
  spp: 32
  total_spp: 256
  max_bounces: 6
