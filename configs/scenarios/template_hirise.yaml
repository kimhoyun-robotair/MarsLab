# =============================================================================
# Self-contained scenario template (HiRISE DEM source, 2-step workflow).
# =============================================================================
#
# Companion file: ``configs/scenarios/template_single_file.yaml`` (procedural
# variant). The two templates differ only in ``terrain.source``; this one
# takes a NASA HiRISE GeoTIFF as input.
#
# Execution workflow (2-step):
# -----------------------------------------------------------------------------
# Step 1) HiRISE GeoTIFF -> elevation.npy + metadata.json (offline, one-shot):
#
#     python3 tools/convert_dem.py \
#         --config tools/dem_conversion/sample_jezero.yaml
#
#   Output: ``elevation.npy`` + ``metadata.json`` written under
#           ``assets/mars_assets/DEM/jezero_crater/``.
#
# Step 2) Run the simulation (Isaac Sim runtime, GDAL-free loading):
#
#     marslab/isaac_python.sh marslab/main.py \
#         --config configs/scenarios/template_hirise.yaml
#
# The Step 1 output directory must match the ``terrain.converted_dem_dir``
# below. Both files validate against the same pydantic schema, so
# ``tools/dem_conversion/sample_jezero.yaml`` is also a ``MarsLabConfig``
# (``terrain.source: hirise`` required) and ``convert_dem.py`` only reads
# ``config.terrain.dem_path`` / ``config.terrain.converted_dem_dir``
# (see tools/convert_dem.py:51-58).
#
# How to validate (passes even with an empty DEM directory):
#   from marslab.config.loader import load_and_validate
#   cfg = load_and_validate("configs/scenarios/template_hirise.yaml")
#
# Reason: the schema only validates ``terrain.source`` / ``terrain.dem_crop``
# / ``terrain.converted_dem_dir`` keys; directory contents are read at
# runtime.
# =============================================================================


# ============================================================================
# mars_env: Mars environment constants
# ----------------------------------------------------------------------------
# Same as template_single_file.yaml; see that file for detailed comments.
# ============================================================================
mars_env:
  gravity: 3.72                    # rarely changed
  atmo_pressure: 610               # rarely changed
  atmo_density: 0.020              # rarely changed
  dust_optical_depth: 0.3          # frequently tuned: tau (0.3=clear, 4.0=storm)
  solar_constant: 589
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60
  sol_duration_seconds: 88642
  dust_opacity_range: [0.5, 2.0]
  sun_azimuth_deg: 180             # frequently tuned: 0=N, 90=E, 180=S, 270=W
  sun_elevation_deg: 45            # frequently tuned: 0=horizon, 90=zenith
  seed: 42                         # change for reproducibility experiments
  dynamic_atmosphere:
    enabled: true                  # frequently tuned: false=static sun
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    tau_profile: "constant"
    tau_constant:
      base_tau: 0.3
    update_interval_frames: 10

# ============================================================================
# terrain: HiRISE DEM (Jezero crater)
# ----------------------------------------------------------------------------
# Most frequently tuned: dem_crop (which DEM region to slice out).
# ----------------------------------------------------------------------------
# Prerequisites:
#   1. Download a HiRISE GeoTIFF (USGS Astrogeology / NASA PDS).
#   2. Edit ``dem_path`` in ``tools/dem_conversion/sample_jezero.yaml``
#      to point at the downloaded GeoTIFF.
#   3. Run ``python3 tools/convert_dem.py --config <that yaml>``.
#   4. Verify the output directory matches ``converted_dem_dir`` below.
# ============================================================================
terrain:
  source: "hirise"                 # never changed: stay on hirise for HiRISE inputs
  scenario_name: "template_hirise"
  converted_dem_dir: "assets/mars_assets/DEM/jezero_crater"
  dem_crop:                        # frequently tuned: 200x200 px window
    row: 180                       # starting row in the DEM (px)
    col: 0                         # starting column in the DEM (px)
    height: 200                    # crop height (px)
    width: 200                     # crop width (px)
  rock_sfd_k: 0.05                 # frequently tuned: Golombek CFA 0.0~0.15
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/mars_assets/mars_terrain_texture"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/mars_assets/mars_rocks/meshes"
  rock_texture_dir: "assets/mars_assets/mars_rocks/textures"
  uv_scale: 1.0
  seed: 42

# ============================================================================
# rendering: RTX render settings (matches template_single_file)
# ============================================================================
rendering:
  mode: "ray_tracing"              # frequently tuned: use path_tracing for dataset generation
  sky_dome_hdri_dir: "assets/mars_assets/mars_sky/"
  resolution: [1920, 1080]
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]
  spp: 32
  total_spp: 256
  max_bounces: 6

scene:
  structure_assets: []

# ============================================================================
# rover: M2020 Perseverance (all physics/sensors/control/ROS2 inlined)
# ----------------------------------------------------------------------------
# Same inline rover block as template_single_file.yaml. In production we
# recommend the shorter ``rover.base_config: configs/robots/rover_m2020.yaml``
# pattern instead.
# ============================================================================
rover:
  enabled: true
  usd_path: "assets/robots/rover/m2020.usd"
  prim_path: "/World/Rover"
  com_offset: [0.2, 0.0, 0.0]
  angular_damping: 12.0
  linear_damping: 0.5
  spawn:
    mode: "dem_center"             # frequently tuned: dem_center | dem_relative | absolute
    xy: [0.0, 0.0]
    z_offset: 0.5
    orientation_rpy: [0.0, 0.0, 0.0]
  chassis:
    mass: 1025.0
    inertia_xx: 1036.1
    inertia_yy: 1182.2
    inertia_zz: 1391.4
    bbox_lwh: [3.0, 2.7, 2.2]
  wheels:
    radius: 0.2667
    diameter_reference: 0.525
    mass: 9.0
    width: 0.40
    inertia_spin: 0.310
    inertia_transverse: 0.275
    friction_static: 0.6
    friction_dynamic: 0.5
    restitution: 0.0
  suspension:
    rocker_damping: 75.0
    bogie_damping: 50.0
  sensors:
    camera:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -2.1]
      local_orientation_rpy_deg: [180.0, 0.0, 0.0]
      resolution: [640, 480]
      focal_length: 24.0
      clipping_range: [0.1, 1000.0]
    lidar_3d:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -0.5]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      range_min: 0.5
      range_max: 100.0
      horizontal_fov_deg: 360.0
      vertical_fov_deg: 30.0
      horizontal_resolution_deg: 0.4
      vertical_resolution_deg: 1.875
      rotation_rate_hz: 10.0
      profile_name: "Example_Rotary"
    lidar_2d:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -0.25]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      range_min: 0.5
      range_max: 50.0
      horizontal_fov_deg: 360.0
      horizontal_resolution_deg: 0.25
      rotation_rate_hz: 30.0
      profile_name: "Example_Rotary_2D"
    imu:
      parent_link: "Body_Chassis"
      local_translation: [0.0, 0.0, 0.0]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
  control:
    wheel_radius: 0.2667
    wheelbase: 2.26
    track_steer: 2.125
    track_middle: 2.369
    max_linear_velocity: 0.5
    max_angular_velocity: 0.5
    drive_joint_names: ["LF_DRIVE", "LM_DRIVE", "LR_DRIVE", "RF_DRIVE", "RM_DRIVE", "RR_DRIVE"]
    steer_joint_names: ["LF_STEER", "LR_STEER", "RF_STEER", "RR_STEER"]
    suspension_joint_names: ["CENTER_DIFFERENTIAL", "LEFT_DIFFERENTIAL", "RIGHT_DIFFERENTIAL", "LEFT_BOGIE", "RIGHT_BOGIE"]
    suspension_damping: 50.0
    drive_damping: 1000.0
    drive_max_force: 1000000.0
    steer_stiffness: 50000.0
    steer_damping: 5000.0
    steer_max_force: 100000.0
    drive_type: "acceleration"
    negate_steer: true
    max_wheel_accel_rate: 0.5
    max_steer_angle: 0.7
    steer_ramp_rate: 2.0
    decel_multiplier: 3.0
    debug_logging: false
  ros2:
    namespace: "rover"
    topics:
      cmd_vel: "cmd_vel"
      robot_description: "robot_description"
      imu: "imu"
      odom: "odom"
      rgb: "rgb/image_raw"
      depth: "depth/image_raw"
      points: "depth/points"
      camera_info: "rgb/camera_info"
      lidar: "lidar/points"
      scan: "scan"
    rates:
      imu: 100
      odom: 50
      rgb: 30
      depth: 30
      points: 30
      camera_info: 30
      lidar: 10
      scan: 30
    odom_publisher:
      frame_id: "odom"
      child_frame_id: "base_link"
      queue_size: 10
