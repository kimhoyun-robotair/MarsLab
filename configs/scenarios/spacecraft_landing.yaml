# Spacecraft Landing Site Scenario
# ---------------------------------------------------------------
# Reuses the Jezero flat terrain from ``jezero_flat.yaml`` (same DEM
# crop, same rover, same atmosphere dials) and dresses it with an
# InSight-style lander + heat shield + backshell + parachute cluster
# at realistic Mars-2020 landing-debris spacing.  The rover spawns
# 10 m east of the lander so it can drive up to the inspection zone.
#
# Placeholder asset paths -- the actual USD assets under
# ``assets/mars_assets/space_assets/`` are produced out-of-band by the
# artist team (InSight lander is NASA public domain; heat shield /
# backshell / parachute are Apache-2.0 user-made).  See
# ``assets/mars_assets/LICENSES.md`` for the full source list.  The
# structure_loader raises FileNotFoundError with a clear pointer when
# the .usd file is missing, so this YAML validates offline even before
# the assets land.
#
# mars_env + rendering defaults come from ``_base.yaml`` via the root-level
# ``base_config`` include; only the morning sun overrides live here.
# ---------------------------------------------------------------

base_config: _base.yaml

mars_env:
  # Morning sun, light from east-southeast -- picked so the landing
  # debris is photogenic for paper figures.
  sun_azimuth_deg: 135
  sun_elevation_deg: 40
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "spacecraft_landing"
  converted_dem_dir: "assets/mars_assets/DEM/jezero_crater"
  dem_crop:
    row: 0
    col: 0
    height: 500
    width: 500
  rock_sfd_k: 0
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/mars_assets/mars_terrain_texture"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/mars_assets/mars_rocks/meshes"
  rock_texture_dir: "assets/mars_assets/mars_rocks/textures"
  uv_scale: 1.0
  seed: 42

# Scene structures — SpaceX Starship + Superheavy on the landing site -------
# Frame note: structures.spawn_xyz is the *absolute* world coordinate in the
# terrain mesh frame whose corner sits at world origin.  For this 500×500
# crop at 1 m/pixel the footprint is X∈[0,499], Y∈[0,499] and the mesh
# centre is (249.5, 249.5).  The rover uses dem_relative offsets, so the
# two YAML blocks live in the same world frame but use different reference
# points — pick structure positions in absolute coords here.
#
# Placement rationale (preserves the visual offset accepted under the prior
# 200×200 crop; only the crop changed, the relative geometry is preserved
# by translating both spawns by the mesh-centre delta of (+150, +150)):
#   * (x=220, y=249.5): ~39.5 m west of the rover spawn (259.5, 249.5),
#     directly in the rover's -X facing line of sight, well inside the
#     mesh footprint.
#   * z=9.90: ground normalized z at (220, 249.5) ≈ 9.592 m (measured
#     against the full elevation.npy; 500×500 normalized z range is
#     [0, 15.456] m).  +0.30 m clearance reproduces the offset (2.05 −
#     1.747 = 0.303 m) that was visually verified under the 200×200 crop.
#     Lower if the model floats, raise if it sinks.
scene:
  structures:
    - name: "spacex_starship"
      asset_path: "assets/mars_assets/space_assets/SpaceX_Starship_-_Spaceship.usdz"
      spawn_xyz: [220.0, 249.5, 9.90]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1,1,1]
      static: true
      collision: true

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Rover parks 10 m east of the lander, facing west so the first
  # navigation goal points straight at the lander.  Orientation yaw=pi
  # (rover faces -X toward the lander); URDF is REP-103 aligned so no
  # X-roll compensation is needed.
  spawn:
    mode: "dem_relative"
    xy: [10.0, 0.0]
    z_offset: 0.5
    orientation_rpy: [0.0, 0.0, 3.14159]
