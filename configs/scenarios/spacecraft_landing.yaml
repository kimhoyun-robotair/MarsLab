# Spacecraft Landing Site Scenario (Scenario 6)
# ---------------------------------------------------------------
# Reuses the Jezero flat terrain from ``jezero_flat.yaml`` (same DEM
# crop, same rover, same atmosphere dials) and dresses it with an
# InSight-style lander + heat shield + backshell + parachute cluster
# at realistic Mars-2020 landing-debris spacing.  The rover spawns
# 10 m east of the lander so it can drive up to the inspection zone.
#
# Placeholder asset paths — the actual USD assets under
# ``assets/structures/spacecraft/`` are produced out-of-band by the
# artist team (InSight lander is NASA public domain; heat shield /
# backshell / parachute are Apache-2.0 user-made).  See
# ``assets/structures/LICENSES.md`` for the full source list.  The
# structure_loader raises FileNotFoundError with a clear pointer when
# the .usd file is missing, so this YAML validates offline even before
# the assets land.
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include; only the
# morning sun overrides live here.
# ---------------------------------------------------------------

base_config: _base.yaml

mars_env:
  # Morning sun, light from east-southeast — picked so the landing
  # debris is photogenic for the iSpaRo paper figure.
  sun_azimuth_deg: 135
  sun_elevation_deg: 40
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "spacecraft_landing"
  converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"
  dem_crop:
    row: 180
    col: 0
    height: 200
    width: 200
  rock_sfd_k: 0
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

# Scene structures — landing debris field -----------------------------------
# Geometry logic (Mars-2020 / InSight analogue):
#   * Lander sits at (0, 0, 0) — DEM centre, the "landing ellipse centroid".
#   * Heat shield is jettisoned early in EDL and lands closest to the
#     lander (~12 m south-east) because it separates before backshell +
#     parachute.  Flipped upside-down (roll=180) -- convex side up.
#   * Backshell + parachute descend together but separate during sky-crane
#     manoeuvre; they impact ~35 m west of the lander still tethered.
#   * Parachute canopy lies a few metres downstream of the backshell,
#     crumpled on the surface (roll=90 + scale reduction to look slumped).
#   * Inspection cone + nav beacon are small reference props the rover
#     visits during the Wk3 SLAM/Nav2 trial.
scene:
  structures:
    - name: "insight_lander"
      asset_path: "assets/structures/spacecraft/insight_lander.usd"
      spawn_xyz: [0.0, 0.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "heat_shield"
      asset_path: "assets/structures/spacecraft/heat_shield.usd"
      spawn_xyz: [9.0, -8.0, 0.0]
      spawn_rpy_deg: [180.0, 0.0, 45.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "backshell"
      asset_path: "assets/structures/spacecraft/backshell.usd"
      spawn_xyz: [-32.0, 12.0, 0.0]
      spawn_rpy_deg: [25.0, 0.0, 120.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "parachute"
      asset_path: "assets/structures/spacecraft/parachute.usd"
      spawn_xyz: [-38.0, 6.0, 0.0]
      spawn_rpy_deg: [90.0, 0.0, 45.0]
      scale: [1.2, 1.2, 0.3]
      static: true
      collision: false   # canopy is soft-body reference only; Nav2 should plan through
    - name: "inspection_beacon"
      asset_path: "assets/structures/spacecraft/inspection_beacon.usd"
      spawn_xyz: [4.0, 2.5, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Rover parks 10 m east of the lander, facing west so the first Nav2
  # goal points straight at the lander.  Orientation RPY=(pi, 0, pi)
  # gives the rover its correct "upright facing -X" pose on Mars Z-up.
  spawn:
    mode: "xy_with_terrain_z"
    xy: [10.0, 0.0]
    z_offset: 0.5
    orientation_rpy: [3.14159, 0.0, 3.14159]
