# Cerberus Fossae Canyon Scenario (Easy)
# HiRISE DEM crop: southern approach with crater feature.
# dz=110m, mean_slope=11.5 deg, traversable(<15 deg)=82%, impassable(>30 deg)=8%.
# Mostly navigable terrain with some steep obstacles and a central crater.
# Purpose: basic autonomous navigation, obstacle avoidance, SLAM baseline.
#
# mars_env + rendering defaults come from ``_base.yaml`` via the root-level
# ``base_config`` include.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "cerberus_canyon_easy"
  converted_dem_dir: "assets/terrain/dem/cerberus_fossae_converted"
  dem_crop:
    row: 8500
    col: 3200
    height: 400
    width: 400
  rock_sfd_k: 0.008
  rock_diameter_range: [0.15, 2.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Easier variant of Cerberus Fossae: gentler slopes allow direct
  # rim approach.  Spawn on the plain edge facing the canyon.
  spawn:
    mode: "dem_relative"
    xy: [0.0, 150.0]
    z_offset: 0.6
    orientation_rpy: [3.14159, 0.0, -1.570796]
