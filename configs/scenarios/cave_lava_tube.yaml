# Scenario 5: Mars Cave (Lava Tube) with Skylight Entry
# Procedural lava tube: half-ellipse cross-section, skylight entry, breakdown debris
# Based on MARS-LT-B variant (Sauro 2020, Blair 2017, Cushing 2007/2012, Blank 2024)
# Tube width 200m, ceiling 50m, 1 skylight, 25% breakdown coverage
# Purpose: cave exploration, SLAM in GPS-denied enclosed environment, autonomous nav
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "procedural"
  scenario_name: "mars_cave_skylight"
  procedural_preset: "cave"
  terrain_size: [400, 400]
  terrain_resolution: 1.0
  seed: 42
  cave:
    tube_width_m: 200.0
    tube_height_ratio: 0.5
    cross_section_noise: 0.20
    tube_direction_deg: 45.0
    tube_curvature: 0.15
    ceiling_thickness_m: 50.0
    skylight_count: 10
    skylight_diameter_m: 20.0
    # R2-A4 (2026-04-22): bumped from 90.0 -> 110.0 to satisfy CaveConfig
    # validator (skylight_depth_m must be >= tube_height = tube_width_m *
    # tube_height_ratio = 200 * 0.5 = 100m). Pre-R2 the validator was not
    # wired in the loader path so the violation slipped through. See
    # marslab/config/schema/terrain.py:154-168 for the rule. Cushing 2007
    # cites 68-178m for Mars skylight shaft depths, so 110m is in range.
    skylight_depth_m: 110.0
    skylight_overhang_deg: 5.0
    debris_cone_present: true
    debris_cone_count: 5
    debris_cone_angle_deg: 30.0
    breakdown_coverage_pct: 25.0
    breakdown_block_mean_m: 0.5
    breakdown_block_sigma: 0.3
    floor_flat_pct: 70.0
    wall_albedo_range: [0.05, 0.15]
    ring_resolution: 40
    path_resolution: 100
  rock_sfd_k: 0.001             # Fewer but larger rocks
  rock_diameter_range: [0.5, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Cave frame (R5 post-split, marslab/terrain/cave/orchestrator.py:135):
  # tube floor normalized to z=0, surface cap at z=150. Centerline passes
  # through the domain center (200, 200) along tube_direction_deg=45°.
  # For seed=42 skylight #4 lands at (181.2, 190.5) — spawn directly beneath
  # so natural light reaches the rover. If ``terrain.seed`` changes, the
  # skylight layout shifts; recompute via generate_cave_mesh(...).
  # ``skylight_positions`` and update xy below. z=0.5 is wheel clearance
  # above the floor.
  spawn:
    mode: "absolute"
    xy: [181.2, 190.5]
    z: 0.5
    orientation_rpy: [3.14159, 0.0, 0.785398]  # face +X+Y along tube axis (45° bearing)
  sensors:
    # Increase depth clip range so RGB camera captures distant tube wall.
    camera:
      clipping_range: [0.1, 500.0]
