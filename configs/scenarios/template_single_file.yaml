# =============================================================================
# Self-contained scenario template (procedural terrain, no external DEM).
# =============================================================================
#
# Most-asked third-party question: "How many files do I need to read to
# understand a single scenario?" Answer: just this one file.
#
# This template inlines both ``configs/scenarios/_base.yaml`` (shared
# mars_env / rendering defaults) and ``configs/robots/rover_m2020.yaml``
# (rover base) so it does not reference any other file:
#
#   * No ``base_config:`` key (root-level include removed).
#   * No ``rover.base_config:`` key (robot include removed).
#
# Compared to the ship-with scenarios:
#   * jezero_flat.yaml: 59 lines + _base.yaml 73 lines + rover_m2020.yaml 232 lines
#     = 364 lines across 3 files
#   * This template: single file, ~200 lines
#
# Trade-off: shared defaults will not auto-propagate when they change.
# Stability up, maintenance up.
# Recommended for: external demos, quick experiments, academic
# reproducibility. For production use, prefer the base_config pattern in
# jezero_flat.yaml.
#
# How to validate:
#   from marslab.config.loader import load_and_validate
#   cfg = load_and_validate("configs/scenarios/template_single_file.yaml")
# =============================================================================


# ============================================================================
# mars_env: Mars environment constants
# ----------------------------------------------------------------------------
# Rarely changed: gravity, atmo_pressure, atmo_density, sol_duration_seconds.
# Frequently tuned:  sun_azimuth_deg, sun_elevation_deg, dust_optical_depth,
#                    dynamic_atmosphere.enabled.
# ============================================================================
mars_env:
  gravity: 3.72                    # m/s^2 (IAU standard, rarely changed)
  atmo_pressure: 610               # Pa (Viking/MSL mean, rarely changed)
  atmo_density: 0.020              # kg/m^3 (rarely changed)
  dust_optical_depth: 0.3          # tau (frequently tuned: 0.3=clear, 4.0=storm)
  solar_constant: 589              # W/m^2 at 1.52 AU (rarely changed)
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60
  sol_duration_seconds: 88642
  dust_opacity_range: [0.5, 2.0]
  sun_azimuth_deg: 180             # frequently tuned: 0=N, 90=E, 180=S, 270=W
  sun_elevation_deg: 45            # frequently tuned: 0=horizon, 90=zenith
  seed: 42                         # change for reproducibility experiments
  dynamic_atmosphere:
    enabled: true                  # frequently tuned: false=static sun, true=sweep
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    tau_profile: "constant"
    tau_constant:
      base_tau: 0.3
    update_interval_frames: 10

# ============================================================================
# terrain: procedural elevation, no external DEM
# ----------------------------------------------------------------------------
# Most frequently tuned: procedural_preset, terrain_size, rock_sfd_k.
# Available procedural_preset values:
#   - "flat":         fully flat (rover debugging)
#   - "crater":       single crater
#   - "hills":        gentle rolling hills
#   - "rocky_plain":  low noise + scattered rocks (recommended for SLAM/Nav benchmarks)
#   - "canyon":       canyon corridor (requires the terrain.canyon block)
#   - "cave":         lava tube (requires the terrain.cave block)
# ============================================================================
terrain:
  source: "procedural"             # never changed: stay procedural without an external DEM
  scenario_name: "template_single_file"
  procedural_preset: "rocky_plain" # frequently tuned: pick from the six presets above
  terrain_size: [256, 256]         # frequently tuned: (rows, cols) px
  terrain_resolution: 1.0          # frequently tuned: m/px (1.0 -> 256 m x 256 m)
  rock_sfd_k: 0.05                 # frequently tuned: Golombek CFA 0.0~0.15
  rock_diameter_range: [0.20, 3.0] # m (anything < 0.20 m is treated as texture)
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/mars_assets/mars_terrain_texture"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/mars_assets/mars_rocks/meshes"
  rock_texture_dir: "assets/mars_assets/mars_rocks/textures"
  uv_scale: 1.0
  seed: 42                         # reproducibility seed (independent of mars_env.seed)

# ============================================================================
# rendering: RTX render settings
# ----------------------------------------------------------------------------
# Frequently tuned: mode (ray_tracing vs path_tracing), resolution.
# Rarely changed: sun_color, fog_color (Mars colours are calibrated).
# ============================================================================
rendering:
  mode: "ray_tracing"              # frequently tuned: prefer path_tracing for dataset generation
  sky_dome_hdri_dir: "assets/mars_assets/mars_sky/"
  resolution: [1920, 1080]         # frequently tuned: [width, height]
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]
  spp: 32                          # path-tracing samples per frame
  total_spp: 256
  max_bounces: 6

# ============================================================================
# scene: static structures (drop-in OBJ/STL/USD spawned alongside terrain)
# ----------------------------------------------------------------------------
# Frequently tuned: structure_assets list (drop-in meshes).
# Leave empty to load just the terrain + rover with no extra structures.
# ============================================================================
scene:
  structure_assets: []

# ============================================================================
# rover: M2020 Perseverance (all physics/sensors/control/ROS2 inlined)
# ----------------------------------------------------------------------------
# Frequently tuned: spawn.xy (spawn position), spawn.z_offset.
# Rarely changed: chassis/wheels/suspension (M2020 ballpark physics).
# ----------------------------------------------------------------------------
# This block is long, but in production we recommend the shorter
# ``base_config`` pattern that points at ``configs/robots/rover_m2020.yaml``.
# This template inlines every field for single-file demo use.
# ============================================================================
rover:
  enabled: true
  usd_path: "assets/robots/rover/m2020.usd"
  prim_path: "/World/Rover"
  com_offset: [0.2, 0.0, 0.0]
  angular_damping: 12.0
  linear_damping: 0.5
  spawn:
    mode: "dem_center"             # frequently tuned: dem_center | dem_relative | absolute
    xy: [0.0, 0.0]                 # frequently tuned: spawn coordinates (m)
    z_offset: 0.5                  # frequently tuned: clearance above terrain
    orientation_rpy: [0.0, 0.0, 0.0]
  chassis:
    mass: 1025.0
    inertia_xx: 1036.1
    inertia_yy: 1182.2
    inertia_zz: 1391.4
    bbox_lwh: [3.0, 2.7, 2.2]
  wheels:
    radius: 0.2667
    diameter_reference: 0.525
    mass: 9.0
    width: 0.40
    inertia_spin: 0.310
    inertia_transverse: 0.275
    friction_static: 0.6
    friction_dynamic: 0.5
    restitution: 0.0
  suspension:
    rocker_damping: 75.0
    bogie_damping: 50.0
  sensors:
    camera:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -2.1]
      local_orientation_rpy_deg: [180.0, 0.0, 0.0]
      resolution: [640, 480]
      focal_length: 24.0
      clipping_range: [0.1, 1000.0]
    lidar_3d:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -0.5]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      range_min: 0.5
      range_max: 100.0
      horizontal_fov_deg: 360.0
      vertical_fov_deg: 30.0
      horizontal_resolution_deg: 0.4
      vertical_resolution_deg: 1.875
      rotation_rate_hz: 10.0
      profile_name: "Example_Rotary"
    lidar_2d:
      parent_link: "Body_Chassis"
      local_translation: [0.3, 0.0, -0.25]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      range_min: 0.5
      range_max: 50.0
      horizontal_fov_deg: 360.0
      horizontal_resolution_deg: 0.25
      rotation_rate_hz: 30.0
      profile_name: "Example_Rotary_2D"
    imu:
      parent_link: "Body_Chassis"
      local_translation: [0.0, 0.0, 0.0]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
  control:
    wheel_radius: 0.2667
    wheelbase: 2.26
    track_steer: 2.125
    track_middle: 2.369
    max_linear_velocity: 0.5       # frequently tuned: max linear velocity (m/s)
    max_angular_velocity: 0.5      # frequently tuned: max angular velocity (rad/s)
    drive_joint_names: ["LF_DRIVE", "LM_DRIVE", "LR_DRIVE", "RF_DRIVE", "RM_DRIVE", "RR_DRIVE"]
    steer_joint_names: ["LF_STEER", "LR_STEER", "RF_STEER", "RR_STEER"]
    suspension_joint_names: ["CENTER_DIFFERENTIAL", "LEFT_DIFFERENTIAL", "RIGHT_DIFFERENTIAL", "LEFT_BOGIE", "RIGHT_BOGIE"]
    suspension_damping: 50.0
    drive_damping: 1000.0
    drive_max_force: 1000000.0
    steer_stiffness: 50000.0
    steer_damping: 5000.0
    steer_max_force: 100000.0
    drive_type: "acceleration"
    negate_steer: true
    max_wheel_accel_rate: 0.5
    max_steer_angle: 0.7
    steer_ramp_rate: 2.0
    decel_multiplier: 3.0
    debug_logging: false
  ros2:
    namespace: "rover"
    topics:
      cmd_vel: "cmd_vel"
      robot_description: "robot_description"
      imu: "imu"
      odom: "odom"
      rgb: "rgb/image_raw"
      depth: "depth/image_raw"
      points: "depth/points"
      camera_info: "rgb/camera_info"
      lidar: "lidar/points"
      scan: "scan"
    rates:
      imu: 100
      odom: 50
      rgb: 30
      depth: 30
      points: 30
      camera_info: 30
      lidar: 10
      scan: 30
    odom_publisher:
      frame_id: "odom"
      child_frame_id: "base_link"
      queue_size: 10
