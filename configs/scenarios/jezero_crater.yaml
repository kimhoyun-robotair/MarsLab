# Jezero Crater + Slopes Scenario
# HiRISE DEM crop: northeast corner of Jezero crater, steepest region
# dz=12.6m, mean_slope=5.08 deg, max_slope=29.9 deg
# 44.8% of area > 5 deg, 6.6% > 10 deg — rover will feel the incline
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "jezero_crater"
  converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"
  dem_crop:
    row: 0
    col: 300
    height: 200
    width: 200
  rock_sfd_k: 0.012
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Crater rim scenario: spawn on the outer (north-east) edge of the
  # 200×200 crop, orientation facing the crater centre so Stage 3
  # smoke tests can drive the rover toward the rim descent.
  spawn:
    mode: "dem_relative"
    xy: [-60.0, -60.0]
    z_offset: 0.7
    orientation_rpy: [3.14159, 0.0, 0.785398]  # 45° yaw toward crater centre
