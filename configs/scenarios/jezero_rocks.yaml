# Jezero Rock-Dense Scenario
# HiRISE DEM crop: same flat region as jezero_flat (row=180, col=0, 200x200)
# High-density large rocks for visual verification and rover obstacle testing
# CFA k=0.08 (~VL1-class density), diameter 0.5-5.0m (large rocks only)
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "jezero_rocks"
  converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"
  dem_crop:
    row: 180
    col: 0
    height: 200
    width: 200
  rock_sfd_k: 0.08
  rock_diameter_range: [0.50, 5.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Spawn at DEM centre and face +X so the rover approaches the
  # rock-dense interior head-on.  z_offset raised to 0.6 m because
  # dense big_rocks (≥0.5 m diameter) can sit directly under the
  # landing footprint on this crop.
  spawn:
    mode: "dem_center"
    xy: [0.0, 0.0]
    z_offset: 0.6
    orientation_rpy: [0.0, 0.0, 0.0]
