# Mars Base (Crewed Outpost) Scenario (Scenario 7)
# ---------------------------------------------------------------
# Reuses the Jezero flat terrain (same DEM as jezero_flat.yaml) and
# dresses it with a crewed-outpost configuration: central habitat
# module flanked by two solar arrays, an airlock, a comm dish, and an
# ISRU plant.  The rover spawns 40 m from the base, simulating a
# returning traverse -- ideal for Nav2 goal-pose evaluation.
#
# Placeholder asset paths — the USD assets under
# ``assets/structures/base/`` are user-authored (Apache-2.0) with some
# geometry adapted from NASA Mars Design Reference Architecture 5.0
# concepts.  See ``assets/structures/LICENSES.md``.  Missing files
# trigger FileNotFoundError in ``marslab.scene.structure_loader``; the
# YAML still validates offline without the bytes in place.
#
# Reviewer 2 #17 (2026-04-24): mars_env + rendering defaults come from
# ``_base.yaml`` via the root-level ``base_config`` include; only the
# sun elevation override lives here.
# ---------------------------------------------------------------

base_config: _base.yaml

mars_env:
  sun_elevation_deg: 50  # +5° vs default for base photography framing
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "mars_base"
  converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"
  dem_crop:
    row: 180
    col: 0
    height: 200
    width: 200
  rock_sfd_k: 0
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"
  rock_texture_dir: "assets/materials/mars_rock"
  uv_scale: 1.0
  seed: 42

# Scene structures — outpost layout -----------------------------------------
# Logical footprint (top-down, +X = east, +Y = north):
#
#                      comm_dish                       (0, 18)
#                         |
#    solar_L  --  habitat  --  solar_R                 (-10..10, 0..4)
#                         |
#                      airlock                         (0, -6)
#                         |
#                       isru                           (0, -14)
#
# Rover starts at (40, 0, 0), approaching from the east.
scene:
  structures:
    - name: "habitat"
      asset_path: "assets/structures/base/habitat_module.usd"
      spawn_xyz: [0.0, 0.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "solar_array_left"
      asset_path: "assets/structures/base/solar_array.usd"
      spawn_xyz: [-10.0, 0.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "solar_array_right"
      asset_path: "assets/structures/base/solar_array.usd"
      spawn_xyz: [10.0, 0.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 180.0]  # mirrored so panels face sun symmetrically
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "airlock"
      asset_path: "assets/structures/base/airlock.usd"
      spawn_xyz: [0.0, -6.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 90.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "comm_dish"
      asset_path: "assets/structures/base/comm_dish.usd"
      spawn_xyz: [0.0, 18.0, 0.0]
      spawn_rpy_deg: [0.0, 20.0, 0.0]   # dish tilted up 20 deg for Earth-return line-of-sight
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true
    - name: "isru_plant"
      asset_path: "assets/structures/base/isru_plant.usd"
      spawn_xyz: [0.0, -14.0, 0.0]
      spawn_rpy_deg: [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
      static: true
      collision: true

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Rover approaches the base from 40 m east, already facing west.
  spawn:
    mode: "xy_with_terrain_z"
    xy: [40.0, 0.0]
    z_offset: 0.5
    orientation_rpy: [3.14159, 0.0, 3.14159]
