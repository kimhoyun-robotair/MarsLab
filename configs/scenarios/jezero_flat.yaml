# Jezero Flat Region Scenario
# HiRISE DEM crop: west side of Jezero crater, minimal elevation variation.
# Candidate: Flat #1 from dev/analysis/analyze_dem_regions.py.
# dz=3.00m, mean_slope=1.97 deg, std=0.62m.
#
# mars_env + rendering defaults come from ``_base.yaml`` via the root-level
# ``base_config`` include; only real overrides live here.

base_config: _base.yaml

mars_env:
  dynamic_atmosphere:
    enabled: true

terrain:
  source: "hirise"
  scenario_name: "jezero_flat"
  converted_dem_dir: "assets/mars_assets/DEM/jezero_crater"
  dem_crop:
    row: 180
    col: 0
    height: 200
    width: 200
  rock_sfd_k: 0
  rock_diameter_range: [0.20, 3.0]
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/mars_assets/mars_terrain_texture"
  rock_color: [0.42, 0.28, 0.20]
  rock_roughness: 0.92
  rock_mesh_dir: "assets/mars_assets/mars_rocks/meshes"
  rock_texture_dir: "assets/mars_assets/mars_rocks/textures"
  uv_scale: 1.0
  seed: 42

rover:
  enabled: true
  base_config: "configs/robots/rover_m2020.yaml"
  # Jezero flat plain is essentially featureless; spawn at DEM centre
  # with a modest clearance so the rover settles gently.
  spawn:
    mode: "dem_center"
    xy: [0.0, 0.0]
    z_offset: 0.5
    orientation_rpy: [0.0, 0.0, 0.0]

# Single drop-in OBJ smoke. Demonstrates the ``structure_assets:`` block
# end-to-end against the procedurally generated test fixture
# (``tests/fixtures/sample_rock.obj`` is a 209-byte tetrahedron). Scenarios
# that do not want a drop-in inherit the empty default from ``_base.yaml``.
scene:
  structure_assets:
    - path: "tests/fixtures/sample_rock.obj"
      position: [10.0, 5.0, 0.0]
      rotation_rpy_deg: [0.0, 0.0, 45.0]
      scale: 1.0
      name: "boulder_01"
