# MarsLab Master Configuration
# All physical parameters for Mars simulation environment.
# Reference: PLAN.md Section 3.5

mars_env:
  gravity: 3.72                      # m/s^2 (IAU standard)
  atmo_pressure: 610                 # Pa (Viking/MSL mean)
  atmo_density: 0.020                # kg/m^3
  dust_optical_depth: 0.3            # tau (clear-ish default)
  solar_constant_mean: 589           # W/m^2 at 1.52 AU
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60             # Celsius
  sol_duration_seconds: 88642        # 24h 37m 22s
  dust_opacity_range: [0.5, 2.0]     # tau range for domain randomization
  sun_azimuth_deg: 180               # degrees (0=N, 90=E, 180=S, 270=W)
  sun_elevation_deg: 45              # degrees above horizon
  seed: 42

terrain:
  # source: "hirise"
  # dem_path: "assets/terrain/dem/jezero_crater.tif"
  source: "procedural"
  procedural_preset: "crater"
  terrain_size: [256, 256]
  terrain_resolution: 1.0
  rock_sfd_k: 0.05                   # CFA = 5%
  rock_diameter_range: [0.20, 3.0]   # meters (< 20cm treated as texture)
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_pbr"  # PBR textures (albedo.png, normal.png, roughness.png)
  seed: 42

rendering:
  mode: "path_tracing"
  sky_dome_hdri_dir: "assets/sky/hdri/"
  resolution: [1280, 720]
  spp: 32                            # samples per pixel per frame
  total_spp: 256                     # total accumulated samples
  max_bounces: 8
  sun_intensity_scale: 5.0           # W/m^2 → Isaac Sim light units
  sun_color: [1.0, 0.95, 0.85]      # warm Mars sunlight
  sun_angular_diameter_deg: 0.35     # sun disk from Mars
  dome_brightness_scale: 1000.0      # sky dome multiplier
  fog_density_scale: 0.002           # tau → fog density
  fog_color: [0.78, 0.62, 0.42]     # Mars dust haze butterscotch

robots:
  - type: "rover"
    urdf_path: "assets/robots/rover/simple_rover.urdf"
    spawn_position: [0.0, 0.0, 1.0]
    sensor_config_paths:
      - "configs/sensors/stereo_rgb.yaml"
      - "configs/sensors/depth_camera.yaml"
      - "configs/sensors/lidar_3d.yaml"
      - "configs/sensors/imu.yaml"
  - type: "rotorcraft"
    urdf_path: "assets/robots/rotorcraft/simple_rotorcraft.urdf"
    spawn_position: [5.0, 0.0, 3.0]
  - type: "quadruped"
    usd_asset_path: "Isaac/Robots/Unitree/Go2/go2.usd"
    spawn_position: [-3.0, 0.0, 1.0]

benchmark:
  annotation_format: "ai4mars"
  dr_axes:
    - "dust_optical_depth"
    - "surface_albedo"
    - "rock_sfd_k"
    - "sun_elevation"
    - "camera_trajectory"
  num_samples: 10000
  seed: 42
