# MarsLab Master Configuration
# All physical parameters for Mars simulation environment.

mars_env:
  gravity: 3.72                      # m/s^2 (IAU standard)
  atmo_pressure: 610                 # Pa (Viking/MSL mean)
  atmo_density: 0.020                # kg/m^3
  dust_optical_depth: 0.3            # tau (clear-ish default)
  solar_constant: 589                # W/m^2 at 1.52 AU
  surface_albedo_range: [0.10, 0.40]
  surface_temp_mean: -60             # Celsius
  sol_duration_seconds: 88642        # 24h 37m 22s
  dust_opacity_range: [0.5, 2.0]     # tau range for domain randomization (also used as the tau-sweep upper bound by visualization scripts)
  sun_azimuth_deg: 180               # degrees (0=N, 90=E, 180=S, 270=W)
  sun_elevation_deg: 45              # degrees above horizon
  obliquity_deg: 25.19               # Mars axial tilt (Allison and McEwen 2000)
  default_latitude_deg: 18.4447      # Jezero crater landing site
  physics_dt: 0.016666666666666666   # s (60 Hz engine tick)
  seed: 42
  dynamic_atmosphere:
    enabled: false                   # static atmosphere by default
    time_scale: 200.0                # real-time-to-sol acceleration factor
    sun_sweep:
      start_azimuth_deg: 90          # sunrise (east)
      end_azimuth_deg: 270           # sunset (west)
      max_elevation_deg: 60          # noon peak (Jezero 18.4 deg N)
    tau_profile: "constant"          # "constant" | "ramp" | "sine"
    tau_constant:
      base_tau: 0.3
    tau_ramp:
      start_tau: 0.3
      end_tau: 2.0
    tau_sine:
      base_tau: 0.5
      amplitude: 0.3
      period_fraction: 1.0
    update_interval_frames: 10       # recompute atmosphere every N frames

terrain:
  # source: "hirise"
  # dem_path: "assets/terrain/dem/jezero_crater.tif"
  # converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"
  source: "procedural"
  procedural_preset: "crater"
  terrain_size: [256, 256]
  terrain_resolution: 1.0
  rock_sfd_k: 0.012                  # CFA ~1.2% (dev: 844 rocks. production: 0.05 = 15K)
  rock_diameter_range: [0.20, 3.0]   # meters (< 20cm treated as texture)
  semantic_classes: ["soil", "bedrock", "sand", "big_rock"]
  texture_dir: "assets/materials/mars_hirise"  # HiRISE Jezero ortho → PBR (4K, NASA)
  rock_color: [0.42, 0.28, 0.20]              # Mars rock reddish-brown
  rock_roughness: 0.92
  rock_mesh_dir: "assets/rocks"                # Blender OBJ meshes (null = Sphere)
  rock_texture_dir: "assets/materials/mars_rock" # Rock PBR textures (null = color only)
  uv_scale: 1.0                                # 1:1 mapping, no tiling (HiRISE ortho matched)
  seed: 42

rendering:
  mode: "ray_tracing"
  sky_dome_hdri_dir: "assets/sky/hdri/"
  resolution: [1920, 1080]
  sun_intensity_scale: 30.0          # W/m^2 -> Isaac Sim path-tracing units (calibrated)
  sun_color: [1.0, 0.95, 0.85]      # warm Mars sunlight
  sun_angular_diameter_deg: 0.35     # sun disk from Mars
  dome_brightness_scale: 5000.0      # sky dome multiplier (calibrated for path-tracing)
  fog_density_scale: 0.002           # tau → fog density
  fog_color: [0.78, 0.62, 0.42]     # Mars dust haze butterscotch

  # sun_prim_path / dome_prim_path: override when a scenario needs multiple
  # lights. Defaults match the canonical paths used by the sun and sky
  # renderers.
  sun_prim_path: "/World/SunLight"
  dome_prim_path: "/World/DomeLight"

  fog:
    enabled: true
    color_amount: 1.0
    start_height: 0.0
    height_falloff: 0.01
    height_density_ratio: 0.5
    # Fog tint is driven by rendering.fog_color above.
  ray_tracing:
    # antialiasing_op: 0=off, 1=FXAA, 2=TAA, 3=DLAA, 4=DLSS.
    # dlss_exec_mode: 0=Performance, 1=Balanced, 2=Quality, 3=Auto.
    antialiasing_op: 3
    dlss_exec_mode: 1
    denoiser_indirect_diffuse: true
    denoiser_reflections: true
  path_tracing:
    spp: 32                         # samples per pixel per frame
    total_spp: 256                  # total accumulated samples
    max_bounces: 6                  # ray bounce depth
    denoiser_optix: true
  sky_dome:
    # Butterscotch Mars sky endpoints (Bell et al. 2006 MER Pancam).
    clear_rgb: [0.76, 0.57, 0.35]
    dusty_rgb: [0.85, 0.75, 0.60]
    brightness_min: 0.1
    brightness_decay: 0.3