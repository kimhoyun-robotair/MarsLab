# M2020 Perseverance Navcam (Navigation Camera, LEFT) preset.
#
# Sprint Day 4-5 Task I-B (2026-04-25): drop-in replacement for the
# ``sensors.camera`` block in ``configs/robots/rover_m2020.yaml``.  Every
# numeric parameter is exposed (G5).  Validates against
# :class:`marslab.config.schema.robot.CameraConfig`.
#
# ---------------------------------------------------------------
# Datasheet reference
#
# Primary source: Maki, J. N. et al. (2020), "The Mars 2020 Engineering
# Cameras and Microphone on the Perseverance Rover", Space Science
# Reviews 216:137. DOI 10.1007/s11214-020-00765-9.
# Tables 2 and 3 carry the optics + detector entries cited here.
# Cross-check: NASA M2020 Mission Press Kit (Feb 2021).
#
#   * Detector: 5120 x 3840 RGB Bayer mosaic (Maki 2020 Table 2).
#   * Pixel pitch: 4.6 um (Maki 2020 Table 2).
#   * Focal length: 19.1 mm fixed-focus (Maki 2020 Table 3).
#   * Best focus: ~1 m, hyperfocal usable to infinity (Maki 2020 Table 3).
#   * Geometry-derived HFOV at the sensor edge:
#       sensor_w = 5120 * 4.6 um = 23.55 mm
#       HFOV = 2 * arctan(23.55 / (2 * 19.1)) = 63.5 deg
#     The Maki 2020 paper quotes a wider 96-deg "FOV" in Table 3; that is
#     the diagonal-corrected FOV including lens distortion.  The geometry-
#     derived HFOV used by Isaac Sim's Camera projection matrix is 63.5
#     deg.  See ``~/MarsLab/tmp/task_IB_finding.md`` for the full
#     reconciliation note.
#   * Stereo baseline: 0.42 m (Maki 2020 Section 2.1 + Fig 4).  Only the
#     LEFT Navcam is provided in this preset; copy this file and shift
#     ``local_translation`` Y by +0.42 m for the RIGHT Navcam.
#   * Mount: Remote Sensing Mast (RSM) head, ~1.99 m above ground when
#     the rover is on a level surface (Maki 2020 Section 2.1).
# ---------------------------------------------------------------
#
# Resolution choice (binned vs full-frame):
#   The flight detector is 5120 x 3840, but Maki 2020 Section 2.6 notes
#   the rover routinely downsamples to 1280 x 960 (4x binning) before
#   downlink.  v1.0 MarsLab uses the binned size to keep the sensor graph
#   throughput tractable; SLAM and Nav2 do not benefit from the full
#   5120 x 3840 image.  Edit ``resolution`` to ``[5120, 3840]`` if your
#   workflow needs the full detector format.
#
# Mount note (M2020 frame -> MarsLab Body_Chassis frame):
#   The MarsLab URDF places ``Body_Chassis`` ~2 m above the ground.  We
#   approximate the RSM Navcam pose as +0.3 m forward, 0.0 m lateral,
#   0.0 m above the chassis origin (i.e. ~2 m above ground), with a 180-
#   deg X-axis flip so the camera looks "forward" in the body frame.
#   Exact RSM joint chain (RSM-Az -> RSM-El -> Mastcam -> Navcam) is NOT
#   modelled in the v1.0 URDF; for paper-grade calibration cross-check
#   against the JPL m2020-urdf-models repo (mars2020 frame -> NCAM_LEFT).
#   TODO verify against Maki 2020 Section 2.1 + URDF kinematic chain.

parent_link: "Body_Chassis"
local_translation: [0.3, -0.21, 0.0]
local_orientation_rpy_deg: [180.0, 0.0, 0.0]

# Binned 4x detector format.  Switch to [5120, 3840] for full-frame.
resolution: [1280, 960]

# Maki 2020 Table 3: 19.1 mm fixed-focus.
focal_length: 19.1

# Mars Navcam best focus ~1 m, hyperfocal to infinity (Maki 2020 Table 3).
# 0.5 m near plane keeps the rover's own wheel-tip out of frame; 1000 m
# far plane covers the whole DEM crop without z-fighting.
clipping_range: [0.5, 1000.0]
