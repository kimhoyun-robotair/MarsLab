# 3D LiDAR sensor configuration.
# Roof-mounted, 360-degree horizontal scan.

sensor:
  type: "lidar"
  name: "lidar_3d"
  mount_link: "base_link"
  offset_position: [0.0, 0.0, 0.4]        # meters, roof mount
  offset_orientation: [0.0, 0.0, 0.0]
  rotation_rate: 10.0                       # Hz
  horizontal_fov: [0.0, 360.0]            # degrees
  vertical_fov: [-15.0, 15.0]             # degrees
  horizontal_resolution: 0.4               # degrees per ray
  vertical_resolution: 2.0                 # degrees per ray
  max_range: 100.0                         # meters
  min_range: 0.4                           # meters
  update_rate: 10
  ros2_topic: "points"
  ros2_frame_id: "lidar_link"
