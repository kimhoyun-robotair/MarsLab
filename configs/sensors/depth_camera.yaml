# Depth camera sensor configuration.
# Co-located with stereo RGB, produces distance-to-image-plane.

sensor:
  type: "camera"
  name: "depth_camera"
  mount_link: "base_link"
  offset_position: [0.4, 0.0, 0.2]
  offset_orientation: [0.0, 0.0, 0.0]
  resolution: [1280, 720]
  focal_length: 2.12
  horizontal_aperture: 20.955              # mm (35mm film standard)
  vertical_aperture: 11.7872               # mm (matches 16:9 aspect ratio)
  clipping_range: [0.1, 100.0]
  enable_depth: true
  update_rate: 30
  ros2_topic: "image_raw"
  ros2_frame_id: "depth_link"
