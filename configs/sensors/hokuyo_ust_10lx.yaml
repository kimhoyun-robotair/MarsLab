# Hokuyo UST-10LX preset for the MarsLab 2D LiDAR slot.
#
# Drop-in replacement for the ``sensors.lidar_2d`` block in
# ``configs/robots/rover_m2020.yaml``.  Every numeric parameter is
# exposed.
#
# Datasheet reference (Hokuyo UST-10LX):
#   * Single-beam planar scanner (no vertical FOV)
#   * 270 deg horizontal angular range (-135 deg to +135 deg)
#   * 0.25 deg angular resolution
#   * 25 ms scan period (40 Hz update rate)
#   * 10 m maximum range, 0.06 m minimum range (rounded to 0.1 m for
#     parity with the Isaac Sim Example_Rotary_2D minimum)
#
# Isaac Sim 5.1 does NOT bundle ``Hokuyo_UST_10LX.json``; using
# ``Example_Rotary_2D`` (bundled) as the base profile so the runtime JSON
# override (``range_min`` / ``range_max`` / ``rotation_rate_hz``) succeeds.
# ``horizontal_fov_deg: 270.0`` is descriptive of the target UST-10LX spec
# but does NOT override the bundled emitter angular range.

# YAML authored in the X-rolled body frame matched by ``rover_m2020.yaml``'s
# ``spawn_orientation_rpy = [3.14159, 0, 0]`` (see
# ``docs/frame_conventions.md``).  In that frame ``Z_body = -Z_world`` so
# a 2-D scanner 0.25 m above the chassis is at ``Z = -0.25``.
parent_link: "Body_Chassis"
local_translation: [0.3, 0.0, -0.25]
local_orientation_rpy_deg: [0.0, 0.0, 0.0]

# Runtime-overridable (will reach Isaac Sim via generated JSON).
range_min: 0.1
range_max: 10.0
rotation_rate_hz: 40.0
# Descriptive of UST-10LX (270 deg, 0.25 deg) but does NOT override the
# bundled Example_Rotary_2D emitter geometry.
horizontal_fov_deg: 270.0
horizontal_resolution_deg: 0.25

# Base profile: must match a JSON file that ships with Isaac Sim 5.1.
profile_name: "Example_Rotary_2D"
profile_json_path: null
usd_profile: null
