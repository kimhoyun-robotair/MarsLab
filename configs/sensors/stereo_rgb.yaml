# Stereo RGB camera sensor configuration.
# Mounts on rover base_link, forward-facing.

sensor:
  type: "camera"
  name: "stereo_rgb"
  mount_link: "base_link"
  offset_position: [0.4, 0.0, 0.2]       # meters relative to mount_link
  offset_orientation: [0.0, 0.0, 0.0]     # euler (roll, pitch, yaw) degrees
  resolution: [1280, 720]
  focal_length: 2.12                       # mm
  horizontal_aperture: 20.955              # mm (35mm film standard)
  vertical_aperture: 11.7872               # mm (matches 16:9 aspect ratio)
  clipping_range: [0.1, 100.0]            # near/far in meters
  enable_depth: false
  # Wk2 (2026-04-14, per slam-nav-integrator request in ros2_topic_spec reply):
  # stereo baseline in meters for the CameraInfo.P[0,3] projection entry.
  # Right-camera P[0,3] = -fx * baseline_m so slam_toolbox / Nav2 can recover
  # depth from disparity. Left-camera P[0,3] = 0. Standard MER-class 20 cm
  # baseline; adjust per the Wk3 stereo calibration pass if needed. Kept on
  # the sensor YAML (not on a downstream launch file) so Wk2 #7's sensor
  # re-enable commit can read it without modifying this file.
  baseline_m: 0.20
  update_rate: 30                          # Hz
  ros2_topic: "image_raw"                  # sub-topic for ROS2 publish
  ros2_frame_id: "camera_link"             # TF frame ID
