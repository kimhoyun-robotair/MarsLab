# Velodyne VLP-16 (Puck) preset for the MarsLab 3D LiDAR slot.
#
# Sprint Day 2 Task D + E (2026-04-25): this YAML is a drop-in replacement
# for the ``sensors.lidar_3d`` block in ``configs/robots/rover_m2020.yaml``.
# Either point a scenario YAML at this preset (``base_config:`` style) or
# copy/paste the body into the rover's sensors block.  Every numeric
# parameter is exposed (G5).
#
# Datasheet reference (Velodyne VLP-16 / Puck):
#   * 16 channels, +/-15° vertical FOV (30° total)
#   * 0.1° - 0.4° horizontal angular resolution at 5 - 20 Hz rotation
#   * 100 m maximum range, 0.5 m minimum range
#   * 360° horizontal coverage
#
# Day 3 H1 fix-up (2026-04-25, post-integration smoke): Isaac Sim 5.1
# does NOT bundle ``Velodyne_VLP16``; the closest VLS-class scanner that
# DOES ship and IS registered in the
# ``isaacsim.sensors.rtx.SUPPORTED_LIDAR_CONFIGS`` dict
# (``isaacsim/sensors/rtx/impl/supported_lidar_configs.py``) is
# ``Ouster_VLS_128``.  We fall back to that so the lidar prim actually
# spawns instead of triggering "Config not found" at runtime.
#
# All numeric YAML fields below are **descriptive only** in v1.0 — they
# document the target VLP-16 spec but Isaac Sim's
# ``LidarRtx(config_file_name=...)`` API takes a bundled USD asset name,
# not a custom JSON path, so YAML overrides do NOT reach Isaac Sim.
# v1.5 follow-up (see ``~/MarsLab/tmp/task_H1_finding.md``):
# (a) register a custom MarsLab USD asset, (b) monkey-patch
# ``SUPPORTED_LIDAR_CONFIGS``, (c) extend the carb setting
# ``app.sensors.nv.lidar.profileBaseFolder`` — three injection points
# all required for true G5 lidar control.

# 2026-04-28: Z sign flipped from -0.5 to +0.5 to match REP-103 after
# the spawn-time X-roll was removed (see ``configs/robots/rover_m2020.yaml``
# ``spawn_orientation_rpy``).  Pre-fix world position preserved.
parent_link: "Body_Chassis"
local_translation: [0.3, 0.0, 0.5]
local_orientation_rpy_deg: [0.0, 0.0, 0.0]

range_min: 0.5
range_max: 100.0
# Descriptive of VLP-16 (16-channel, 30 deg vertical) but do NOT override
# the bundled VLS-128 emitter geometry (Day 3 H1 limitation).
horizontal_fov_deg: 360.0
vertical_fov_deg: 30.0
horizontal_resolution_deg: 0.2
vertical_resolution_deg: 2.0
# Runtime-overridable (will reach Isaac Sim via generated JSON).
rotation_rate_hz: 10.0

# Base profile: must match a name registered in
# ``isaacsim.sensors.rtx.SUPPORTED_LIDAR_CONFIGS``.
profile_name: "Ouster_VLS_128"
profile_json_path: null
# usd_profile: null falls back to the asset path keyed off profile_name.
usd_profile: null
