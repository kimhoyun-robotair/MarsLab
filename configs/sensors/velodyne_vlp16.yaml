# Velodyne VLP-16 (Puck) preset for the MarsLab 3D LiDAR slot.
#
# Drop-in replacement for the ``sensors.lidar_3d`` block in
# ``configs/robots/rover_m2020.yaml``.  Either point a scenario YAML at
# this preset (``base_config:`` style) or copy/paste the body into the
# rover's sensors block.  Every numeric parameter is exposed.
#
# Datasheet reference (Velodyne VLP-16 / Puck):
#   * 16 channels, +/-15 deg vertical FOV (30 deg total)
#   * 0.1 deg to 0.4 deg horizontal angular resolution at 5-20 Hz rotation
#   * 100 m maximum range, 0.5 m minimum range
#   * 360 deg horizontal coverage
#
# Isaac Sim 5.1 does NOT bundle ``Velodyne_VLP16``; the closest VLS-class
# scanner that ships and is registered in the
# ``isaacsim.sensors.rtx.SUPPORTED_LIDAR_CONFIGS`` dict
# (``isaacsim/sensors/rtx/impl/supported_lidar_configs.py``) is
# ``Ouster_VLS_128``.  We fall back to that so the lidar prim actually
# spawns instead of triggering "Config not found" at runtime.
#
# All numeric YAML fields below are descriptive only -- they document the
# target VLP-16 spec, but Isaac Sim's ``LidarRtx(config_file_name=...)``
# API takes a bundled USD asset name (not a custom JSON path), so YAML
# overrides do NOT reach Isaac Sim.  Future work to register a custom
# MarsLab USD asset, monkey-patch ``SUPPORTED_LIDAR_CONFIGS``, and extend
# the carb setting ``app.sensors.nv.lidar.profileBaseFolder`` is required
# for true config-driven LiDAR control.

# YAML authored in the X-rolled body frame matched by ``rover_m2020.yaml``'s
# ``spawn_orientation_rpy = [3.14159, 0, 0]`` (see
# ``docs/frame_conventions.md``).  In that frame ``Z_body = -Z_world`` so
# a sensor 0.5 m above the chassis is at ``Z = -0.5``.
parent_link: "Body_Chassis"
local_translation: [0.3, 0.0, -0.5]
local_orientation_rpy_deg: [0.0, 0.0, 0.0]

range_min: 0.5
range_max: 100.0
# Descriptive of VLP-16 (16-channel, 30 deg vertical) but does NOT
# override the bundled VLS-128 emitter geometry.
horizontal_fov_deg: 360.0
vertical_fov_deg: 30.0
horizontal_resolution_deg: 0.2
vertical_resolution_deg: 2.0
# Runtime-overridable (will reach Isaac Sim via generated JSON).
rotation_rate_hz: 10.0

# Base profile: must match a name registered in
# ``isaacsim.sensors.rtx.SUPPORTED_LIDAR_CONFIGS``.
profile_name: "Ouster_VLS_128"
profile_json_path: null
# usd_profile: null falls back to the asset path keyed off profile_name.
usd_profile: null
