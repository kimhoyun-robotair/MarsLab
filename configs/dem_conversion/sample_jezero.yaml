# =============================================================================
# DEM conversion config (offline preprocessing): HiRISE GeoTIFF -> numpy.
# =============================================================================
#
# Companion script: ``scripts/convert_dem.py``.
# This file is the input for a one-shot offline conversion run.
#
# Run:
#   python3 scripts/convert_dem.py \
#       --config configs/dem_conversion/sample_jezero.yaml
#
# Output:
#   ``elevation.npy`` (float32) + ``metadata.json`` written under
#   ``assets/terrain/dem/jezero_crater_converted/``.
#   The Isaac Sim runtime reads this directory without GDAL.
#
# Schema notes:
# -----------------------------------------------------------------------------
# This file validates against ``MarsLabConfig``
# (``marslab.config.schema.root.MarsLabConfig``); ``convert_dem.py`` only
# uses ``terrain.source`` / ``terrain.dem_path`` / ``terrain.converted_dem_dir``
# (see scripts/convert_dem.py:39, 46, 51-58).  There is no separate
# conversion-only schema -- this file uses a subset of the scenario schema.
# Therefore ``mars_env`` / ``rendering`` blocks may be left empty and
# pydantic defaults will satisfy validation.
# =============================================================================

# ----- terrain (the only block actually consumed by the conversion) -----
# Frequently tuned: dem_path, converted_dem_dir.
# Pick the same DEM region as the scenario YAML's dem_crop for behavioural
# consistency (matches configs/scenarios/jezero_flat.yaml::terrain.dem_crop).
terrain:
  source: "hirise"                                                  # never changed
  dem_path: "assets/terrain/dem/jezero_crater.tif"                  # HiRISE GeoTIFF path
  converted_dem_dir: "assets/terrain/dem/jezero_crater_converted"   # output directory
  # dem_crop is not used by the conversion step (the entire DEM is converted).
  # Pick a region in the scenario YAML's dem_crop instead -- e.g.
  # configs/scenarios/jezero_flat.yaml -> row=180, col=0, 200x200.

# ----- mars_env / rendering (placeholders for schema validation) -----
# The conversion script does not consume these blocks.  ``MarsLabConfig``
# pydantic defaults satisfy validation, but they are written explicitly to
# emphasise schema compliance.
mars_env:
  seed: 42                                                          # placeholder; conversion is deterministic regardless

rendering:
  mode: "ray_tracing"                                               # placeholder; conversion does not read this
