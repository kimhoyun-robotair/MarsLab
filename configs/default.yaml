# Canonical MarsLab scenario config.
# Experiment variants use CLI overrides (--sun-azimuth-deg, --sun-elevation-deg).
#
# This file replaces the six ship-with scenario YAMLs (jezero_flat,
# jezero_crater, jezero_rocks, cerberus_canyon, cerberus_canyon_easy,
# spacecraft_landing) and their shared _base.yaml include fragment.
# Terrain and scene blocks are absent because MarsLab consumes a supplied
# Scene USDZ package; scene authoring is not part of this configuration.
#
# Usage:
#   marslab/isaac_python.sh marslab/main.py --usda assets/scene/jezero_plain/jezero_plain.usdz
#   marslab/isaac_python.sh marslab/main.py --usda assets/scene/jezero_plain/jezero_plain.usdz \
#       --sun-azimuth-deg 135 --sun-elevation-deg 40

mars_env:
  gravity: 3.72
  dust_optical_depth: 0.3
  solar_constant: 589
  sol_duration_seconds: 88642
  sun_azimuth_deg: 180
  sun_elevation_deg: 45
  dynamic_atmosphere:
    enabled: true
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    tau_profile: "constant"
    tau_constant:
      base_tau: 0.3
    update_interval_frames: 10

rendering:
  mode: "ray_tracing"
  sky_dome_hdri_dir: "../assets/mars_sky/"
  resolution: [1920, 1080]
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]
  path_tracing:
    spp: 32
    total_spp: 256
    max_bounces: 6
