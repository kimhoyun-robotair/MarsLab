# NASA JPL Perseverance (M2020) rover — common base configuration.
#
# This file is consumed by Stage 3 scenarios via
# ``configs/scenarios/<name>.yaml``  ->  rover.base_config .
# The scenario loader deep-merges the scenario's ``rover:`` block onto
# these defaults (scenario wins on leaf conflicts).
#
# Blocks here mirror the legacy ``configs/phase1.yaml`` rover block
# verbatim so Stage 1 and Stage 3 share identical physics/sensors/
# control tuning.  Do NOT put per-scenario tweaks here — put them in
# the scenario YAML instead.

usd_path: "assets/robots/rover/m2020.usd"
# URDF source: NASA JPL m2020-urdf-models, vendored as a git submodule
# under ``assets/m2020-urdf-models/``.  Forked from
# github.com/nasa-jpl/m2020-urdf-models to pin a commit and decouple
# from upstream availability.  See ``THIRD_PARTY_LICENSES.md`` for
# attribution (NASA/JPL release IDs URS307049, URS309682).  Run
# ``git submodule update --init`` after cloning MarsLab for the URDF
# + meshes to appear on disk.
#
# This field is documentation only -- the URDF -> USD conversion
# script ``scripts/phase1/convert_urdf_to_usd.py`` has its own
# ``DEFAULT_URDF`` constant pointing at the same path and accepts
# a ``--urdf`` CLI override.  Runtime code does NOT consume this
# URDF; it loads the converted USD at ``usd_path`` above.  Keep this
# key in sync with ``DEFAULT_URDF`` if either path changes.
urdf_source_path: "assets/m2020-urdf-models/rover/m2020.urdf"
prim_path: "/World/Rover"

# Stage-1 spawn pose is a fallback only; Stage-3 scenarios override
# via the ``spawn:`` block below.  The 180° X-roll keeps the USD
# upright after the glTF Y-up -> USD Z-up conversion.
spawn_position: [0.0, 0.0, 0.0]
spawn_orientation_rpy: [3.14159, 0.0, 0.0]

# Default Stage-3 spawn spec.  Scenarios override mode / xy / z_offset
# to land the rover at a scenario-appropriate starting point.
spawn:
  mode: "dem_center"
  xy: [0.0, 0.0]
  z_offset: 0.5
  orientation_rpy: [3.14159, 0.0, 0.0]

# Chassis mass-bias compensation (see phase1.yaml comments).
com_offset: [0.2, 0.0, 0.0]
angular_damping: 12.0
linear_damping: 0.5

# --- Day 2 Task B (2026-04-26): M2020 ballpark physics override ---
# Values below are M2020 Perseverance order-of-magnitude correct (NOT exact).
# Speed/control limits stay user-tunable (see ``control:`` block); these
# blocks pin chassis mass / wheel mass / friction / inertia so the URDF
# auto-computed placeholders never reach PhysX.  Sources cited inline.

chassis:
  # Total dry mass of M2020 Perseverance per NASA fact sheet (1025 kg).
  # mars.nasa.gov/mars2020/spacecraft/rover/  (M2020 actual).
  mass: 1025.0
  # Bounding-box inertia tensor from chassis envelope 3.0 m x 2.7 m x 2.2 m
  # at M = 1025 kg.  Solid uniform rectangular cuboid:
  #   ixx = M/12 * (W^2 + H^2)
  #   iyy = M/12 * (L^2 + H^2)
  #   izz = M/12 * (L^2 + W^2)
  # Computed offline (see test_rover_physics_inject.py::test_chassis_inertia_matches_bbox).
  # Replaces URDF auto-computed placeholder so PhysX sees a deterministic
  # tensor.  M2020 ballpark — NOT a calibrated CAD-derived inertia.
  inertia_xx: 1036.1   # kg*m^2  (W=2.7, H=2.2)
  inertia_yy: 1182.2   # kg*m^2  (L=3.0, H=2.2)
  inertia_zz: 1391.4   # kg*m^2  (L=3.0, W=2.7)
  bbox_lwh: [3.0, 2.7, 2.2]   # documentation only — used by the unit test
                              #   to recompute inertia from first principles.

wheels:
  # M2020 wheel diameter is 0.525 m (52.5 cm) — see Heverly et al., 2013
  # IEEE Aerospace Conference (M2020 actual).  The current ``control.wheel_radius``
  # of 0.2667 m corresponds to a 0.5334 m diameter (URDF-derived); we keep
  # that value for kinematic IK consistency and document the 1.6 % gap below.
  radius: 0.2667           # m  — matches ``control.wheel_radius`` exactly.
  diameter_reference: 0.525  # m  — M2020 actual; documentation only.
  # Per-wheel mass estimate (M2020 ballpark).  Public M2020 papers do not
  # publish a per-wheel mass; 9.0 kg is a literature-aligned estimate for an
  # aluminum-machined, spoked rover wheel of this diameter.  6 wheels x 9 kg
  # = 54 kg total — leaves the 1025 kg chassis dominating articulation
  # inertia, which matches the M2020 mass distribution.
  mass: 9.0                # kg per wheel — M2020 estimate.
  # Cylinder inertia about the spin axis (X) and the two transverse axes:
  #   I_spin       = m * r^2 / 2
  #   I_transverse = m * (3 r^2 + h^2) / 12   with h = wheel width
  # Wheel width assumed h = 0.40 m (M2020 ballpark).  Inertia values are
  # offline-computed in the unit test for evidence.
  width: 0.40              # m  — wheel width (M2020 ballpark).
  inertia_spin: 0.310      # kg*m^2  (about spin axis)
  inertia_transverse: 0.275  # kg*m^2  (radial axes)
  # PhysX material friction.  Mars regolith literature (Sullivan et al. 2017,
  # JGR; Heverly et al. 2013) places effective wheel-soil friction in the
  # 0.4-0.7 range; we adopt the midpoint as a starting point.  Static >
  # dynamic so the rover does not creep on slope hold.
  friction_static: 0.6     # mu_s — Mars regolith literature.
  friction_dynamic: 0.5    # mu_d — Mars regolith literature.
  restitution: 0.0         # No bounce on regolith (literature consensus).

suspension:
  # Rocker-bogie joint damping (passive viscous resistance).  The pre-existing
  # ``control.suspension_damping = 50`` covered every rocker/bogie joint with
  # one number; we now distinguish rocker vs bogie so future tuning can
  # target the differential beam without touching the bogie pivot.
  rocker_damping: 75.0     # N*m*s/rad  — primary rocker arms.
  bogie_damping: 50.0      # N*m*s/rad  — bogie sub-arms (matches legacy).

# Offline URDF-to-USD converter flags.  Runtime must NOT re-run URDF
# import; these are consumed only by scripts/phase1/convert_urdf_to_usd.py.
urdf_merge_fixed_joints: false
urdf_fix_base: false
urdf_self_collision: false
urdf_create_physics_scene: false

ros2:
  namespace: "rover"
  topics:
    cmd_vel: "cmd_vel"
    imu: "imu"
    odom: "odom"
    rgb: "rgb/image_raw"
    depth: "depth/image_raw"
    points: "depth/points"       # RGB-D PointCloud2 (RealSense-style); Day 2 sprint task F (2026-04-25).
    lidar: "lidar/points"
    scan: "scan"                 # 2D LaserScan for slam_toolbox / Nav2
  rates:
    imu: 100
    odom: 50
    rgb: 30
    depth: 30
    points: 30                   # depth-derived PointCloud2 matches the depth rate
    lidar: 10
    scan: 30                     # Example_Rotary_2D scanRateBaseHz = 30 Hz
  # R3 (2026-04-22) G5 — frame names previously hardcoded in
  # marslab/ros2_bridge/odometry_publisher.py defaults.  init_rclpy_side
  # reads this sub-map and threads the values through
  # create_odometry_publisher so slam_toolbox and Nav2 YAMLs share one
  # source of truth.  Absent → fall back to the function defaults.
  odom_publisher:
    frame_id: "odom"
    child_frame_id: "base_link"
    queue_size: 10

sensors:
  camera:
    parent_link: "Body_Chassis"
    local_translation: [0.3, 0.0, -2.1]
    local_orientation_rpy_deg: [180.0, 0.0, 0.0]
    resolution: [640, 480]
    focal_length: 24.0
    clipping_range: [0.1, 1000.0]

  # 3D rotary RTX LiDAR.  Sprint Day 2 Task D (2026-04-25): every
  # numeric parameter that used to hide inside Isaac Sim's
  # ``Example_Rotary.json`` profile is now declared here so the YAML is
  # the single source of truth (G5).  Values mirror the bundled JSON for
  # behaviour-preserving migration: 16-beam Velodyne-style scanner,
  # 30 deg vertical FOV, 360 deg horizontal at 0.4 deg horizontal step,
  # 10 Hz rotation, 0.5–100 m range.
  lidar_3d:
    parent_link: "Body_Chassis"
    local_translation: [0.3, 0.0, -0.5]
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]
    range_min: 0.5
    range_max: 100.0
    horizontal_fov_deg: 360.0
    vertical_fov_deg: 30.0
    horizontal_resolution_deg: 0.4
    vertical_resolution_deg: 1.875
    rotation_rate_hz: 10.0
    profile_name: "Example_Rotary"
    profile_json_path: null
    # Task E (2026-04-25): swap the LiDAR USD model by changing this
    # key (e.g. ``Velodyne_VLP16``).  ``null`` falls back to
    # ``profile_name`` so the runtime behaviour matches pre-Task-E.
    usd_profile: null

  # 2D LaserScan sensor for slam_toolbox / Nav2.  Clones the RTX Lidar
  # pipeline used by ``lidar_3d``; only the bundled profile and mount
  # height differ (0.25 m below the 3D lidar).  Numerics mirror the
  # Isaac Sim bundled ``Example_Rotary_2D`` JSON (single beam at -2°
  # elevation, 360° horizontal, 0.25° step, 30 Hz rotation).
  lidar_2d:
    parent_link: "Body_Chassis"
    local_translation: [0.3, 0.0, -0.25]
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]
    range_min: 0.5
    range_max: 50.0
    horizontal_fov_deg: 360.0
    horizontal_resolution_deg: 0.25
    rotation_rate_hz: 30.0
    profile_name: "Example_Rotary_2D"
    profile_json_path: null
    usd_profile: null

  imu:
    parent_link: "Body_Chassis"
    local_translation: [0.0, 0.0, 0.0]
    local_orientation_rpy_deg: [0.0, 0.0, 0.0]

control:
  # Geometry derived from URDF kinematic chain (m2020.urdf).
  wheel_radius: 0.2667
  wheelbase: 2.26
  track_steer: 2.125
  track_middle: 2.369
  max_linear_velocity: 0.5
  max_angular_velocity: 0.5

  drive_joint_names:
    - "LF_DRIVE"
    - "LM_DRIVE"
    - "LR_DRIVE"
    - "RF_DRIVE"
    - "RM_DRIVE"
    - "RR_DRIVE"
  steer_joint_names:
    - "LF_STEER"
    - "LR_STEER"
    - "RF_STEER"
    - "RR_STEER"
  suspension_joint_names:
    - "CENTER_DIFFERENTIAL"
    - "LEFT_DIFFERENTIAL"
    - "RIGHT_DIFFERENTIAL"
    - "LEFT_BOGIE"
    - "RIGHT_BOGIE"

  suspension_damping: 50.0
  drive_damping: 1000.0
  drive_max_force: 1000000.0
  steer_stiffness: 50000.0
  steer_damping: 5000.0
  steer_max_force: 100000.0
  drive_type: "acceleration"

  negate_steer: true
  max_wheel_accel_rate: 0.5
  max_steer_angle: 0.7
  steer_ramp_rate: 2.0
  decel_multiplier: 3.0
  debug_logging: false
