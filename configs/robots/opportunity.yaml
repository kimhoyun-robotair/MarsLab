# Opportunity: MarsLab-authored simulation model from NASA visual/source data.
# This is not a NASA-issued URDF, flight dynamic model, or flight gain set.
# Camera calibration: NASA/JPL NAIF instrument kernels; individual URLs below.
# Camera poses are chassis-relative FLU for ROS; USD optical transforms remain authored.
# Images use a pinhole approximation; no CAHVOR/E distortion or detector physics.
# Clip ranges, dynamics gains, angular caps, contact, and damping are simulation tuning.
# Selected camera near clips skip measured opaque NASA visualization housing surfaces.
# This render-only workaround preserves calibrated poses; it is not a flight near-plane specification.
# IMU at chassis reference and zero sensor/encoder noise are idealizations.
# Real mission LiDAR and direct depth cameras are absent; synthetic depth is disabled.
# Flight speed/wheel diameter: https://pds.nasa.gov/data/pds4/context-pds4/instrument_host/spacecraft.mer2_1.0.xml
# MER 8 Hz uses documented accumulated IMU cadence, not a certified surface rate.
# IMU: https://pds.nasa.gov/ds-view/pds/viewContext.jsp?identifier=urn:nasa:pds:context:instrument:imu.mer2&version=1.2
# navcam_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_nl_20040125_c196.ti
# navcam_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_nr_20040125_c197.ti
# pancam_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_pl_f2_20040125_c199.ti
# pancam_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_pr_f2_20040125_c207.ti
# hazcam_front_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_fl_20040125_c33.ti
# hazcam_front_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_fr_20040125_c34.ti
# hazcam_rear_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_rl_20040125_c35.ti
# hazcam_rear_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_rr_20040125_c36.ti
# microscopic_imager: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer1_mi_f2_20040125_c194.ti
# MI mount is a geometry-derived fixed stowed-arm proxy; NASA kernel supplies optical calibration. See techreport/opportunity.md.
rover:
  name: opportunity
  usd_path: ../../assets/robots/opportunity/opportunity.usda
  urdf_source_path: ../../assets/robots/opportunity/opportunity.urdf
  prim_path: /World/Rover
  spawn:
    mode: dem_center
    xy: [0.0, 0.0]
    z_offset: 0.1
    orientation_rpy: [0.0, 0.0, 0.0]
  angular_damping: 12.0
  linear_damping: 0.5
  chassis:
    rigid_body_prim_name: Body_Chassis
    container_prim_name: Body_Chassis
    joints_prim_name: joints
  wheels:
    link_names: [Body_WheelLeftFront, Body_WheelLeftMiddle, Body_WheelLeftRear, Body_WheelRightFront,
      Body_WheelRightMiddle, Body_WheelRightRear]
    friction_static: 0.6
    friction_dynamic: 0.5
    restitution: 0.0
  suspension:
    rocker_damping: 75.0
    bogie_damping: 50.0
    rocker_joint_names: [LEFT_DIFFERENTIAL, RIGHT_DIFFERENTIAL]
    bogie_joint_names: [LEFT_BOGIE, RIGHT_BOGIE]
    differential_joint_names: [LEFT_DIFFERENTIAL, RIGHT_DIFFERENTIAL]
  ros2:
    namespace: rover
    topics:
      cmd_vel: cmd_vel
      imu: imu
      imu_noisy: imu_noisy
      odom: odom
      gt_trajectory: GT_Trajectory
      rgb: rgb/image_raw
      depth: depth/image_raw
      points: depth/points
      camera_info: rgb/camera_info
      lidar: lidar/points
      scan: scan
      joint_states: joint_states
    odom_publisher:
