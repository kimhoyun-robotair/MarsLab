# Mast camera poses are relative to Body_MastTilt; MAHLI is relative to Body_ArmTurret.
# MAHLI mount is approximated from NASA visual LED aperture geometry; official raw
# calibration and reference pose are documented in techreport/curiosity.md.
# Curiosity: MarsLab-authored simulation model from NASA visual/source data.
# Camera calibration: NASA/JPL NAIF instrument kernels; individual URLs below.
# Camera poses use mount-relative FLU for ROS; the default mount is the chassis.
# Images use a pinhole approximation; no CAHVOR/E distortion or detector physics.
# Clip ranges, dynamics gains, angular caps, contact, and damping are simulation tuning.
# Selected camera near clips skip measured opaque NASA visualization housing surfaces.
# Near clipping preserves the selected mount pose; MAHLI uses the documented visual-pose retarget.
# IMU at chassis reference and zero sensor/encoder noise are idealizations.
# Real mission LiDAR and direct depth cameras are absent; synthetic depth is disabled.
# Flight speed reference and 8 Hz IMU: https://robotics.jpl.nasa.gov/media/documents/ROB-20-0040_R3.pdf
# navcam_left_a: https://naif.jpl.nasa.gov/pub/naif/MSL/kernels/ik/msl_nla_20120731_c04.ti
# mastcam_left: https://naif.jpl.nasa.gov/pub/naif/MSL/kernels/ik/msl_ml_20120731_c03.ti
# mastcam_right: https://naif.jpl.nasa.gov/pub/naif/MSL/kernels/ik/msl_mr_20120731_c03.ti
# navcam_right_a: https://naif.jpl.nasa.gov/pub/naif/MSL/kernels/ik/msl_nra_20120731_c04.ti
# navcam_left_b: https://naif.jpl.nasa.gov/pub/naif/MSL/kernels/ik/msl_nlb_20130530_c05.ti
