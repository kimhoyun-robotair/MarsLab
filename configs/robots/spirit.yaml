# Spirit: MarsLab-authored simulation model from NASA visual/source data.
# This is not a NASA-issued URDF, flight dynamic model, or flight gain set.
# Provenance: ../../LICENSE-NASA-3D-RESOURCES.txt
# Sensor evidence: ../../assets/robots/spirit/sensors.json; ../../LICENSE-NAIF.txt
# Model derivations: ../../assets/robots/spirit/
# Camera calibration: NASA/JPL NAIF instrument kernels; individual URLs below.
# Camera poses are chassis-relative FLU for ROS; USD optical transforms remain authored.
# Images use a pinhole approximation; no CAHVOR/E distortion or detector physics.
# Clip ranges, dynamics gains, angular caps, contact, and damping are simulation tuning.
# Selected camera near clips skip measured opaque NASA visualization housing surfaces.
# This render-only workaround preserves calibrated poses; it is not a flight near-plane specification.
# Measured housing geometry and per-camera overrides: ../../assets/robots/spirit/DERIVATION.md
# IMU at chassis reference and zero sensor/encoder noise are idealizations.
# Real mission LiDAR and direct depth cameras are absent; synthetic depth is disabled.
# Speed/wheel diameter: https://pds.nasa.gov/data/pds4/context-pds4/instrument_host/spacecraft.mer2_1.0.xml
# MER 8 Hz uses documented accumulated IMU cadence, not a certified surface rate.
# IMU: https://pds.nasa.gov/ds-view/pds/viewContext.jsp?identifier=urn:nasa:pds:context:instrument:imu.mer2&version=1.2
# navcam_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_nl_20031204_c174.ti
# navcam_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_nr_20031204_c175.ti
# pancam_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_pl_f2_20031204_c177.ti
# pancam_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_pr_f2_20031204_c185.ti
# hazcam_front_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_fl_20031204_c58.ti
# hazcam_front_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_fr_20031204_c59.ti
# hazcam_rear_left: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_rl_20031204_c60.ti
# hazcam_rear_right: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_rr_20031204_c61.ti
# microscopic_imager: https://naif.jpl.nasa.gov/pub/naif/MER/kernels/ik/mer2_mi_f2_20031204_c172.ti
# MI mount is a geometry-derived fixed stowed-arm proxy; NASA kernel supplies optical calibration. See assets/robots/spirit/sensors.json pose_source.
rover:
  name: spirit
  usd_path: ../../assets/robots/spirit/spirit.usda
  urdf_source_path: ../../assets/robots/spirit/spirit.urdf
  prim_path: /World/Rover
  spawn:
    mode: dem_center
    xy: [0.0, 0.0]
    z_offset: 0.1
    orientation_rpy: [0.0, 0.0, 0.0]
  angular_damping: 12.0
  linear_damping: 0.5
  chassis:
    rigid_body_prim_name: Body_Chassis
    container_prim_name: Body_Chassis
    joints_prim_name: joints
  wheels:
    link_names: [Body_WheelLeftFront, Body_WheelLeftMiddle, Body_WheelLeftRear, Body_WheelRightFront,
      Body_WheelRightMiddle, Body_WheelRightRear]
    friction_static: 0.6
    friction_dynamic: 0.5
    restitution: 0.0
  suspension:
    rocker_damping: 75.0
    bogie_damping: 50.0
    rocker_joint_names: [LEFT_DIFFERENTIAL, RIGHT_DIFFERENTIAL]
    bogie_joint_names: [LEFT_BOGIE, RIGHT_BOGIE]
    differential_joint_names: [LEFT_DIFFERENTIAL, RIGHT_DIFFERENTIAL]
  ros2:
    namespace: rover
    topics:
      cmd_vel: cmd_vel
      imu: imu
      imu_noisy: imu_noisy
      odom: odom
      gt_trajectory: GT_Trajectory
      rgb: rgb/image_raw
      depth: depth/image_raw
      points: depth/points
      camera_info: rgb/camera_info
      lidar: lidar/points
      scan: scan
      joint_states: joint_states
    odom_publisher:
