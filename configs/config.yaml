scene:
  usdz_path: ../assets/scene/main_crater/main_crater.usdz

runtime:
  headless: false
  ros2_enabled: true
  atmosphere_enabled: true

mars_env:
  gravity: 3.72
  dust_optical_depth: 0.05
  solar_constant: 589
  sol_duration_seconds: 88642
  sun_azimuth_deg: 90.07
  sun_elevation_deg: 3.47
  dynamic_atmosphere:
    enabled: false
    initial_sol_fraction: 0.5
    time_scale: 200.0
    sun_sweep:
      start_azimuth_deg: 90
      end_azimuth_deg: 270
      max_elevation_deg: 60
    update_interval_frames: 10

rendering:
  mode: ray_tracing
  sky_dome_hdri_dir: ../assets/mars_sky/
  sun_intensity_scale: 30.0
  sun_color: [1.0, 0.95, 0.85]
  sun_angular_diameter_deg: 0.35
  dome_brightness_scale: 5000.0
  fog_density_scale: 0.002
  fog_color: [0.78, 0.62, 0.42]
  sky_dome:
    clear_rgb: [0.76, 0.57, 0.35]
    dusty_rgb: [0.85, 0.75, 0.60]
    tau_saturation: 3.0
    brightness_min: 0.1
    brightness_decay: 0.3
    hdri_clear: mars_sky_clear.png
    hdri_moderate: mars_sky_moderate.png
    hdri_dusty: mars_sky_dusty.png
  path_tracing:
    spp: 32
    total_spp: 256
    max_bounces: 6

rover:
  usd_path: ../assets/robots/rover/m2020.usd
  urdf_source_path: ../assets/m2020-urdf-models/rover/m2020.urdf
  prim_path: /World/Rover
  spawn:
    mode: dem_center
    xy: [0.0, 0.0]
    z_offset: 0.1
    orientation_rpy: [0.0, 0.0, 0.0]
  com_offset: [0.2, 0.0, 0.0]
  angular_damping: 12.0
  linear_damping: 0.5
  chassis:
    rigid_body_prim_name: Body_Chassis
    mass: 1025.0
    inertia_xx: 1036.1
    inertia_yy: 1182.2
    inertia_zz: 1391.4
  wheels:
    link_names:
      - Frame_WHEEL_LF
      - Frame_WHEEL_LM
      - Frame_WHEEL_LR
      - Frame_WHEEL_RF
      - Frame_WHEEL_RM
      - Frame_WHEEL_RR
    mass: 9.0
    inertia_spin: 0.310
    inertia_transverse: 0.275
    friction_static: 0.6
    friction_dynamic: 0.5
    restitution: 0.0
  suspension:
    rocker_damping: 75.0
    bogie_damping: 50.0
    rocker_joint_names: [CENTER_DIFFERENTIAL, LEFT_DIFFERENTIAL, RIGHT_DIFFERENTIAL]
    bogie_joint_names: [LEFT_BOGIE, RIGHT_BOGIE]
  ros2:
    namespace: rover
    topics:
      cmd_vel: cmd_vel
      robot_description: robot_description
      imu: imu
      imu_noisy: imu_noisy
      odom: odom
      gt_trajectory: GT_Trajectory
      rgb: rgb/image_raw
      depth: depth/image_raw
      points: depth/points
      camera_info: rgb/camera_info
      lidar: lidar/points
      joint_states: joint_states
    odom_publisher:
      frame_id: odom
      child_frame_id: base_link
      queue_size: 10
    sensor_parent_frame_id: Body_Chassis
  sensors:
    seed: 42
    camera:
      local_translation: [1.2, 0.0, 2.1]
      local_orientation_rpy_deg: [0.0, 6.6, 0.0]
      resolution: [640, 480]
      focal_length_mm: 18.0
      clipping_range: [0.1, 100.0]
      depth_sensor:
        enabled: false
        baseline_mm: 55.0
        min_distance_m: 0.3
        max_distance_m: 100.0
        noise_mean: 0.0
        noise_sigma: 0.005
        confidence_threshold: 0.95
        max_disparity_pixel: 110.0
    lidar_3d:
      local_translation: [1.45, 0.0, 2.1]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      range_min: 5.0
      range_max: 100.0
      horizontal_fov_deg: 220.0
      vertical_fov_deg: 45.0
      rotation_rate_hz: 30.0
      profile_name: OS1
      profile_json_path: null
      usd_profile: null
      variant: OS1_REV6_128ch10hz1024res
    imu:
      sampling_frequency_hz: 30
      local_translation: [0.0, 0.0, 0.0]
      local_orientation_rpy_deg: [0.0, 0.0, 0.0]
      sigma_lin_acc: 0.05
      sigma_ang_vel: 0.005
  control:
    wheel_radius: 0.2667
    wheelbase: 2.26
    track_steer: 2.125
    track_middle: 2.369
    max_linear_velocity: 4.0
    max_angular_velocity: 0.7
    drive_joint_names:
      - LF_DRIVE
      - LM_DRIVE
      - LR_DRIVE
      - RF_DRIVE
      - RM_DRIVE
      - RR_DRIVE
    steer_joint_names:
      - LF_STEER
      - LR_STEER
      - RF_STEER
      - RR_STEER
    drive_damping: 1000.0
    drive_max_force: 1000000.0
    steer_stiffness: 50000.0
    steer_damping: 5000.0
    steer_max_force: 100000.0
    drive_type: acceleration
    negate_steer: true
    max_wheel_accel_rate: 0.5
    max_steer_angle: 0.7
    steer_ramp_rate: 2.0
    decel_multiplier: 3.0
    debug_logging: false
  wheel_odometry:
    enabled: true
    left_wheel_joints: [LF_DRIVE, LM_DRIVE, LR_DRIVE]
    right_wheel_joints: [RF_DRIVE, RM_DRIVE, RR_DRIVE]
    track_width: 2.369
    slip_left: 0.02
    slip_right: 0.02
    sigma_omega: 0.05

wheel_odom:
  publish_tf: true
