name: Security
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system GDAL libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin
      - name: Pin Python GDAL to system libgdal version
        run: pip install "GDAL==$(gdal-config --version)"
      - name: Install MarsLab + dev deps
        run: pip install -e ".[dev]"
      - name: Verify GDAL version           #  for Debugging
        run: python -c "from osgeo import gdal; print('GDAL:', gdal.__version__)"
      - name: Run pip-audit
        run: pip-audit --desc 