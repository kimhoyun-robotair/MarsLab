name: Lint

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install black>=24.0 ruff>=0.4

      - name: Check formatting
        run: black --check --diff marslab/

      - name: Run linter
        run: ruff check marslab/
