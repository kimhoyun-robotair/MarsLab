name: Unit Tests
on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    # Project targets Python 3.12+ only (see ``requires-python`` in
    # pyproject.toml). 3.10 was previously included for backward
    # compatibility but is no longer supported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system GDAL libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin
      - name: Pin Python GDAL to system libgdal version
        run: pip install "GDAL==$(gdal-config --version)"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        # ``addopts = "-m 'not integration'"`` in pyproject.toml keeps
        # Isaac Sim-dependent tests out of this GPU-less runner.
        run: pytest tests/unit/ -v --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system GDAL libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev gdal-bin
      - name: Pin Python GDAL to system libgdal version
        run: pip install "GDAL==$(gdal-config --version)"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy (config/ + environment/)
        run: mypy